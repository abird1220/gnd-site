<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GameFeed — Dev News</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#021025;
  --card:#0b1320;
  --muted:#9aa6b2;
  --accent:#60a5fa;
  --accent-2:#38bdf8;
  --radius:10px;
  --image-focal-y: 12%; /* how far down from the top to center the crop (0% = very top) */

  /* Your tuned ratios — tweak here */
  --main-hero-height: 532px;
  --side-hero-width: 360px;

  /* Side hero sizing */
  --side-hero-row-h: 260px;
  --side-hero-media-h: 130px;
}

/* Base */
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;background:linear-gradient(180deg,#021025,#071225 60%);color:#eaf0fb}
.container{max-width:1200px;margin:24px auto;padding:0 18px}

/* Header & controls */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:8px;background:var(--accent);color:#03213a;display:flex;align-items:center;justify-content:center;font-weight:700}
.title{font-size:18px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.top-controls{display:flex;gap:12px;align-items:center}
.search{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:8px}
.search input{background:transparent;border:0;outline:none;color:inherit;width:220px;font-size:14px}
.select{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:8px;color:var(--muted)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 8px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.active{background:rgba(96,165,250,0.08);color:var(--accent);border-color:rgba(96,165,250,0.14)}

/* Section titles */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.section-title{font-weight:800;font-size:20px;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.section-sub{color:var(--muted);font-size:12px}

/* Layout */
.layout{display:flex;gap:16px;margin-top:8px}

/* Clamp */
.clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ===== MAIN HERO ===== */
.main-hero{
  position:relative; flex:1; height:var(--main-hero-height);
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04); cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.main-hero:hover{transform:translateY(-8px);box-shadow:0 28px 56px rgba(2,6,23,0.7)}
.main-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.main-hero img.logo-fit{object-fit:contain; padding:0}
.main-hero .overlay{
  position:absolute; left:0; right:0; bottom:0; padding:16px;
  background:linear-gradient(180deg, rgba(2,16,37,0) 0%, rgba(2,16,37,0.6) 35%, rgba(2,16,37,0.9) 100%);
}
.main-hero .title{font-size:22px;font-weight:800;margin:0 0 6px 0}
.main-hero .meta{color:#c5d2e0;font-size:13px;margin-bottom:6px}
.main-hero .summary{color:#eaf0fb;font-size:14px}

/* Hero arrows */
.hero-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:999px;
  background:rgba(9,16,29,0.55); border:1px solid rgba(255,255,255,0.2);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(4px);
  cursor:pointer; user-select:none;
  transition:background .15s ease, transform .15s ease, opacity .15s ease;
  opacity:.88;
}
.hero-nav:hover{background:rgba(9,16,29,0.7); transform:translateY(-50%) scale(1.05)}
.hero-prev{left:12px}
.hero-next{right:12px}
.hero-nav svg{pointer-events:none}

/* ===== SIDE HEROES ===== */
.side-wrap{width:var(--side-hero-width);display:flex;flex-direction:column;gap:10px}
.side-grid{display:grid;gap:12px;grid-auto-rows: var(--side-hero-row-h)}
.side-hero{
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04);
  cursor:pointer; transition:transform .18s ease,box-shadow .18s ease;
  display:flex; flex-direction:column; min-height:0;
}
.side-hero:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(2,6,23,0.5)}
.side-hero-media{position:relative; flex:0 0 var(--side-hero-media-h); background:#061025}
.side-hero-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% var(--image-focal-y); display:block}
.side-hero-media img.logo-fit{object-fit:contain; padding:0}
.side-hero-body{flex:1 1 auto; min-height:0; overflow:hidden; padding:10px; display:flex; flex-direction:column; gap:6px}
.side-hero-title{font-size:16px;font-weight:800;margin:0;line-height:1.2}
.side-hero-summary{color:#eaf0fb;font-size:13px;line-height:1.35}
.side-hero-meta{color:#c5d2e0;font-size:12px; margin-top:auto}

/* Fade tail for clamped summary */
.fade-tail{
  mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}

/* Grid cards */
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.02);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(2,6,23,0.6)}
.thumb{width:100%;height:0;padding-bottom:56.25%;position:relative;background:#061025}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.logo-fit{object-fit:contain;padding:0}
.card-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.card-title{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.tag{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.card-summary{color:#dfe9f5;font-size:14px;line-height:1.3}

/* Pager */
.pager{display:flex;justify-content:center;margin:22px 0}
.btn{
  padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.02);color:#eaf0fb;font-size:14px;cursor:pointer;
}
.btn:hover{background:rgba(255,255,255,0.06)}

/* responsive */
@media(max-width:900px){
  .layout{flex-direction:column}
  .side-wrap{width:100% !important}
  .side-grid{grid-auto-rows: 260px}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">
      <div class="logo">GF</div>
      <div>
        <div class="title">GameFeed</div>
        <div class="subtitle">Direct from devs — Blizzard • Pokémon GO • Path of Exile</div>
      </div>
    </div>

    <div class="top-controls">
      <div class="search" title="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35" stroke="#9aa6b2" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Search title or summary..." aria-label="Search articles" />
      </div>

      <select id="sortSelect" class="select" title="Sort">
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Filter</div>
      <div id="filters" class="filters"></div>
    </div>
    <div style="text-align:right;color:var(--muted)"></div>
  </div>

  <div class="section-head">
    <div class="section-title">Featured Headlines</div>
    <div class="section-sub">Auto-rotating through top stories</div>
  </div>

  <main class="layout" role="main" aria-label="News hero and feed">
    <section class="main-hero" id="mainHero" tabindex="0" aria-label="Featured main article"></section>

    <section class="side-wrap" aria-label="Featured">
      <div class="side-grid" id="sideGrid" aria-live="polite"></div>
    </section>
  </main>

  <div class="section-title" style="margin-top:22px">Latest News</div>

  <section class="grid" id="feedGrid" aria-live="polite" aria-label="All news articles"></section>

  <div id="empty" style="display:none;text-align:center;color:var(--muted);padding:40px">No articles match your filters.</div>

  <div class="pager" id="pager" style="display:none">
    <button id="loadMore" class="btn" aria-label="Load more articles">Load more</button>
  </div>

  <div class="footer" style="display:none">Built with ❤️ — uses news.json</div>
</div>

<script>
const ARTICLES = [{"title": "Concept Art - Keepers of the Flame League and Kirac’s Vault Pass", "url": "https://www.pathofexile.com/forum/view-thread/3881480", "summary": "In this post, we’re sharing some concept art from the Path of Exile: Keepers of the Flame League and Kirac’s Vault Pass, which includes an exclusive Armour Set themed around the eldritch entity of the Atlas - the Maven. Check them out here!", "image": "images/poe-logo.png", "date": "2025-11-24T20:07:48Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame Uber Boss Kill Event Winners", "url": "https://www.pathofexile.com/forum/view-thread/3881239", "summary": "The Keepers of the Flame Uber Boss Kill Event has now concluded! The race for the top 5 was intense, so we congratulate those who were able to reach the end and defeat the Uber Incarnation of Dread. Find out the winners and rewards in this news post.", "image": "images/poe-logo.png", "date": "2025-11-23T19:52:54Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Take a Ride on Turbulent Timeways December 2 to February 3", "url": "https://news.blizzard.com/en-us/article/24242437/take-a-ride-on-turbulent-timeways-december-2-to-february-3", "summary": "Once more, the Bronze Dragonflight has discovered growing disturbances in the timeways, with several rapidly intersecting our own! Timewalk through a previous expansion each week for 10 consecutive weeks, beginning and ending with the Shadowlands. This grand tour through World of Warcraft's past delivers six new Timewalking Dungeons for players to undertake—De Other Side, Spires of Ascension, Plaguefall, Necrotic Wake, Sanguine Depths, and Halls of Atonement.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ji/JI9Z1IXBWVYG1763589017685.png", "date": "2025-11-20T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Uber Boss Kill Event Highlights", "url": "https://www.pathofexile.com/forum/view-thread/3880122", "summary": "The Uber Boss Kill Event for Keepers of the Flame is ending soon, and while the top 5 prizes have already been claimed on PC, there is still time to join and earn a guaranteed Mystery Box. In the meantime, check out some highlights in this news post.", "image": "images/poe-logo.png", "date": "2025-11-19T21:53:57Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Save 50% on Warcraft® RTS Games!", "url": "https://news.blizzard.com/en-us/article/24243441/save-50-on-warcraft-rts-games", "summary": "Save big on three iconic Warcraft titles. Play Warcraft I: Remastered, Warcraft II: Remastered, and Warcraft III: Reforged to relive the epic adventure that laid the foundation for Azeroth’s most epic stories! You can also purchase the Warcraft Battle Chest with all three of these legendary Warcraft titles.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/5o/5OKZ7IRNJFYQ1750810471396.png", "date": "2025-11-19T18:13:51Z", "subheading": "Warcraft 3: Reforged", "game": "Warcraft 3: Reforged", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/bltac6bbe944de0a563/5d48a388bf384b03afd01567/warcraft-iii.svg", "source": "blizzard"}, {"title": "DOOM: The Dark Ages | Update 3 Release Notes", "url": "https://news.blizzard.com/en-us/article/24246291/doom-the-dark-ages-update-3-release-notes", "summary": "Update 3 for DOOM: The Dark Ages introduces Ripatorium 2.0, offering additional Encounter Presets, deeper customization options, additional jukebox tracks and the ability to share your custom encounters on a per-round basis via Passcode sharing.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/h9/H9DN6FCTRHHG1763585099710.png", "date": "2025-11-19T18:00:00Z", "subheading": "DOOM: The Dark Ages", "game": "DOOM: The Dark Ages", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt85b519f2c7116ef3/67e3453678eb3df3914b50e8/game_icon_aries.svg", "source": "blizzard"}, {"title": "Now Available! World of Warcraft: Blood Ties by Christie Golden", "url": "https://news.blizzard.com/en-us/article/24204922/now-available-world-of-warcraft-blood-ties-by-christie-golden", "summary": "World of Warcraft: Blood Ties is an original prequel novel to the highly anticipated World of Warcraft: Midnight game expansion, the second chapter in the Worldsoul Saga, and chronicles the journey of Arator the Redeemer, son of High Exarch Turalyon and the legendary Alleria Windrunner, as he embarks on a journey investigating rumors of a strange glow emanating from the ruins of a long abandoned Legion base, which leads him to uncover more about himself, his parents, and their heroic legacy.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/0j/0JVBJG4ZUJTI1747844990661.png", "date": "2025-11-19T00:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Build Showcase", "url": "https://www.pathofexile.com/forum/view-thread/3879829", "summary": "In Path of Exile: Keepers of the Flame there are many exciting builds! Today we've gathered up a handful that might inspire your next build. Check them out in today's news post.", "image": "images/poe-logo.png", "date": "2025-11-18T22:05:44Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Enhance Your WoW®: Burning Crusade Classic Anniversary Edition Experience", "url": "https://news.blizzard.com/en-us/article/24242435/enhance-your-wow-burning-crusade-classic-anniversary-edition-experience", "summary": "Prepare to tread once again through the Dark Portal and into the Fel-scarred realm of Outland with WoW: Burning Crusade Classic Anniversary Edition, launching early next year and included with WoW Subscription or Game Time.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/g9/G93DRS4D8BST1763412764131.png", "date": "2025-11-18T21:15:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Now Available on the Shop: The Trader’s Gilded Brutosaur Mount", "url": "https://news.blizzard.com/en-us/article/24243860/now-available-on-the-shop-the-traders-gilded-brutosaur-mount", "summary": "Celebrate camaraderie between the Alliance and the Horde with the return of the awe-inspiring Trader’s Gilded Brutosaur, adorned with an Anniversary themed harness encrusted with gems representing World of Warcraft’s expansions. Brave the world of Azeroth on this magnificent Zandalari beast with Morten and Killia, bringing the auction house and the mail to you on the go!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/7m/7M0RFKF1IXWV1729787686306.png", "date": "2025-11-18T20:30:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "WoW®: Burning Crusade Classic Anniversary Edition Pre-Patch Arrives January 13", "url": "https://news.blizzard.com/en-us/article/24242436/wow-burning-crusade-classic-anniversary-edition-pre-patch-arrives-january-13", "summary": "Prepare to tread once again through the Dark Portal and into the Fel-scarred realm of Outland with Burning Crusade Classic Anniversary Edition, launching early next year and included with your WoW Subscription or Game Time.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/6w/6WIAFHYRQ4QN1763416924061.png", "date": "2025-11-18T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Legion Remix: Argus Eternal Now Live!", "url": "https://news.blizzard.com/en-us/article/24239491/legion-remix-argus-eternal-now-live", "summary": "Get ready for fast frenetic fun in Legion Remix as you meet up with the infinite dragonflight once more, level new characters, and earn a variety of items to add to your collection. Replay the Argus campaign across three deadly zones. Take on the Seat of the Triumvirate and Antorus, the Burning Throne.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/7v/7VMQAFTWRTE61763496967895.jpg", "date": "2025-11-18T17:59:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Mists of Pandaria Classic: The Thunder King Arrives December 9", "url": "https://news.blizzard.com/en-us/article/24242434/mists-of-pandaria-classic-the-thunder-king-arrives-december-9", "summary": "Gather heroes, sound the drums, the Thunder King comes! The time is nigh to spearhead an assault on the Thunder King’s stronghold. Arriving December 9 at 3:00 pm PST, this update delivers two new zones—Isle of Thunder and Isle of Giants, a new gear upgrade system—Thunderforging, a new legendary chapter, two new world bosses—Oondasta and Nalak, and the Throne of Thunder 12-encounter raid.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/e6/E6T1YUAJ8PMA1763129660165.png", "date": "2025-11-17T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Supporter Packs Concept Art", "url": "https://www.pathofexile.com/forum/view-thread/3879202", "summary": "With the launch of Keepers of the Flame, we introduced new Supporter Packs , the Champion of Theopolis and Verdant Magus series. With a variety of unique microtransactions, we’ve gathered some pieces of concept art in today's post.", "image": "images/poe-logo.png", "date": "2025-11-16T23:04:46Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Join the World of Warcraft 21st Anniversary Celebration", "url": "https://news.blizzard.com/en-us/article/24242432/join-the-world-of-warcraft-21st-anniversary-celebration", "summary": "Join the celebration as World of Warcraft celebrates its 21st Anniversary with a variety of activities and a myriad of ways to earn currency to purchase a plethora of items—and this year, you can don the intrepid threads of the Loyal Watchman ensemble.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/3y/3Y4QG1WSCCQH1762889408861.png", "date": "2025-11-16T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Hotfixes: November 14, 2025", "url": "https://news.blizzard.com/en-us/article/24240525/hotfixes-november-14-2025", "summary": "Here you will find a list of hotfixes that address various issues related to World of Warcraft: The War Within, Mists of Pandaria Classic, Season of Discovery, WoW Classic Era, and Hardcor ro designer and a former pro, shares his experience in OWWC and explains why you should cheer along.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/mz/MZ46D74FJWTR1763063186036.png", "date": "2025-11-14T17:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Original Soundtrack", "url": "https://www.pathofexile.com/forum/view-thread/3878031", "summary": "We know you always appreciate a good league soundtrack, and this one is no exception. Experience the atmosphere of Breach through Keepers of the Flame Original Soundtrack by Kamil Orman-Janowski and Michael James Collier in today's news post!", "image": "images/poe-logo.png", "date": "2025-11-14T00:30:37Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Combat Philosophy and Addon Disarmament in Midnight", "url": "https://news.blizzard.com/en-us/article/24246290/combat-philosophy-and-addon-disarmament-in-midnight", "summary": "Join Game Director Ion Hazzikostas as he recaps and explains the planned changes to addon capabilities, and the accompanying broader changes to combat and encounters.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/t8/T8QJDWCF1T2Y1755621947838.png", "date": "2025-11-13T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "34.0.2 Patch Notes", "url": "https://news.blizzard.com/en-us/article/24247520/34-0-2-patch-notes", "summary": "Check out the latest balance updates for Hearthstone, Wild, and Battlegrounds!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/jd/JD1GQJSWO7WR1762906729061.jpg", "date": "2025-11-13T16:55:00Z", "subheading": "Hearthstone", "game": "Hearthstone", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt05905fb295358316/5d48a37efbf0e17fc6dafd3c/hearthstone.svg", "source": "blizzard"}, {"title": "3.27.0c Patch Notes Preview", "url": "https://www.pathofexile.com/forum/view-thread/3877494", "summary": "Later today, we’ll be releasing Patch 3.27.0c for Path of Exile, including improvements to make Breach encounters more rewarding, over 80 new Foulborn Uniques, improved a plethora of scarabs, and bugfixes. Find out more here.", "image": "images/poe-logo.png", "date": "2025-11-12T21:59:38Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Black Ops 7: Progression Intel", "url": "https://news.blizzard.com/en-us/article/24244023/black-ops-7-progression-intel", "summary": "Ready to start your Black Ops 7 Career? Then read on for a full briefing about all the Day One unlocks including Level Unlocks, Prestige, Weapon Prestige, Calling Cards, Camos, Mastery Badges, and More!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/h7/H7ETUM4869L91762976581963.jpg", "date": "2025-11-12T18:00:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "Midnight Prologue: “The Warning” Content Update Goes Live December 2!", "url": "https://news.blizzard.com/en-us/article/24247509/midnight-prologue-the-warning-content-update-goes-live-december-2", "summary": "With the Ghosts of K’aresh behind us, Azeroth stands on the precipice of a future overshadowed by Xal’atath and the relentless advance of the Void. In \"The Warning\", the stage is set for what comes next before continuing the story in the Midnight expansion. Players will also be welcomed home with the start of Housing Early Access for those who have pre-purchased the expansion!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ni/NISS2FQP1VRD1762904592472.png", "date": "2025-11-12T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Stake Your Claim with Housing Early Access and Come Home December 2!", "url": "https://news.blizzard.com/en-us/article/24244464/stake-your-claim-with-housing-early-access-and-come-home-december-2", "summary": "With the release of the “The Warning” Midnight Prologue content update, players who have purchased any edition of the Midnight expansion can join a neighborhood, purchase a house, and start customizing their new home with Housing Early Access! If you don’t have Midnight yet, don’t worry. You’ll still be able to begin adding to your Housing collection through a variety of activities and achievements, or by purchasing them from vendors throughout Azeroth.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/5s/5S58OENWB1I91762892971141.png", "date": "2025-11-12T17:59:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "The Arena World Championship and Mythic Dungeon International Grand Finals are here!", "url": "https://news.blizzard.com/en-us/article/24244640/the-arena-world-championship-and-mythic-dungeon-international-grand-finals-are-here", "summary": "Get ready for the ultimate showdown as the Arena World Championship (AWC) and Mythic Dungeon International (MDI) reach their electrifying finales—where legends are made and champions crowned! The world’s fiercest gladiators and dungeoneers will clash for glory, record-breaking feats, and a share of over $500,000 USD in prizes.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/we/WEHRG97ES5GI1762567826843.png", "date": "2025-11-12T17:55:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "New Foulborn Uniques in Patch 3.27.0c", "url": "https://www.pathofexile.com/forum/view-thread/3877094", "summary": "As we announced last week , we are currently working on the 3.27.0c patch, which includes various improvements to Breach mechanics as well as a new batch of Foulborn Uniques. Check out some of them in this news post.", "image": "images/poe-logo.png", "date": "2025-11-11T21:38:25Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "The Midnight Beta Test is Now Live!", "url": "https://news.blizzard.com/en-us/article/24245100/the-midnight-beta-test-is-now-live", "summary": "Over the course of the test, we'll be inviting community veterans, press, fansites, friends, and family to check out the upcoming expansion and give us feedback. Players who pre-purchase or who upgrade to the Epic Edition of Midnight will also gain access to the beta and three-day early access to the expansion.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/rk/RK1VLHXL3PSJ1761694514707.png", "date": "2025-11-11T20:05:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Diablo Immortal Bug Fixes and Patch Notes for All Platforms", "url": "https://news.blizzard.com/en-us/article/24166781/diablo-immortal-bug-fixes-and-patch-notes-for-a egend in Azeroth.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ep/EPKHX7CCMLV21762387607305.png", "date": "2025-11-07T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "The Last Chance Finals Are Here!", "url": "https://news.blizzard.com/en-us/article/24244463/the-last-chance-finals-are-here", "summary": "Here is how you can watch Hearthstone competitors battle it out for the last spot in the World Championship.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/7z/7Z8B829570O31761931797623.png", "date": "2025-11-07T17:55:00Z", "subheading": "Hearthstone", "game": "Hearthstone", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt05905fb295358316/5d48a37efbf0e17fc6dafd3c/hearthstone.svg", "source": "blizzard"}, {"title": "Keepers of the Flame - What We’re Working On", "url": "https://www.pathofexile.com/forum/view-thread/3874760", "summary": "It’s been almost a week since the launch of Keepers of the Flame, and our team continues to monitor community feedback. Over the past few days, we’ve deployed several hotfixes and a patch to address some of the issues players have been experiencing. In this news post, we’d like to outline what we’re currently working on.", "image": "images/poe-logo.png", "date": "2025-11-07T00:44:36Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame Twitch Highlights", "url": "https://www.pathofexile.com/forum/view-thread/3874244", "summary": "Since its launch, Path of Exile: Keepers of the Flame had a lot of exciting moments caught on camera, and we've gathered up some of the recent highlights to share with you. Check it out in today's news post.", "image": "images/poe-logo.png", "date": "2025-11-05T23:33:09Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Breach Encounters and Monsters in Maps", "url": "https://www.pathofexile.com/forum/view-thread/3874191", "summary": "Over the past few days, we’ve seen a number of reports about Breaches preventing monsters from spawning. We’ve been actively testing this issue, and have some findings to share with you in this news post.", "image": "images/poe-logo.png", "date": "2025-11-05T20:40:31Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Dawn of the Hunt Mystery Box Microtransactions Now Available in Store", "url": "https://www.pathofexile.com/forum/view-thread/3873143", "summary": "The Dawn of the Hunt Mystery Box microtransactions are now available for purchase in both Path of Exile 1 and 2. If you missed getting anything from opening the Mystery Boxes, now's your chance to get it!", "image": "images/poe-logo.png", "date": "2025-11-03T23:42:01Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "What We're Working On", "url": "https://www.pathofexile.com/forum/view-thread/3872574", "summary": "The launch of Path of Exile: Keepers of the Flame over the weekend was one of our smoothest launches ever. Thanks to everyone who logged in to try it out! Check out today's news post for more information on what we're working on.", "image": "images/poe-logo.png", "date": "2025-11-03T01:22:28Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame Launch - Live Updates 🔴", "url": "https://www.pathofexile.com/forum/view-thread/3870904", "summary": "The Path of Exile: Keepers of the Flame expansion has launched! We'll be updating this thread live throughout the day with any relevant info you may need about the expansion's deployment.", "image": "images/poe-logo.png", "date": "2025-10-31T19:01:09Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame Challenge Rewards", "url": "https://www.pathofexile.com/forum/view-thread/3870709", "summary": "In the Keepers League, you’ll be able to earn a set of exclusive microtransactions themed around the Keepers of the Flame expansion by completing 40 new challenges. Find out more in today's news post!", "image": "images/poe-logo.png", "date": "2025-10-31T01:30:32Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Path of Exile: Keepers of the Flame Launches Soon", "url": "https://www.pathofexile.com/forum/view-thread/3870689", "summary": "Path of Exile: Keepers of the Flame will launch on PC and Console soon! In this news post, we’ve gathered all the information you need to know about what happens on launch day and how to start downloading early.", "image": "images/poe-logo.png", "date": "2025-10-30T23:59:24Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "New and Changed Gems in Path of Exile: Keepers of the Flame", "url": "https://www.pathofexile.com/forum/view-thread/3870620", "summary": "Path of Exile: Keepers of The Flame introduces several new Gems available and some changes to existing Skill and Support Gems. Check out the list in today's news post.", "image": "images/poe-logo.png", "date": "2025-10-30T21:07:01Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame Launch Twitch Drops", "url": "https://www.pathofexile.com/forum/view-thread/3870472", "summary": "Celebrate the launch of Path of Exile: Keepers of the Flame with us by tuning into your favorite Twitch stream! We’ll be running two weeks of Twitch Drops, including a special drop campaign for community streamers. Find out more in this news post!", "image": "images/poe-logo.png", "date": "2025-10-30T01:34:09Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Path of Exile: Keepers of the Flame Item Filter Information", "url": "https://www.pathofexile.com/forum/view-thread/3870283", "summary": "To help you get ready for the launch of Path of Exile: Keepers of the Flame, we’ve prepared all the Item Filter Information you need in this news post.", "image": "images/poe-logo.png", "date": "2025-10-28T23:50:20Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "New Halloween Microtransactions", "url": "https://www.pathofexile.com/forum/view-thread/3870097", "summary": "It's the time of year to spread some seasonal scare, and we've got some new treats to help you trick! Check out the range of new and returning Halloween microtransactions in today's news post.", "image": "images/poe-logo.png", "date": "2025-10-28T02:23:13Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame FAQ", "url": "https://www.pathofexile.com/forum/view-thread/3870059", "summary": "Following the Keepers of the Flame Content Reveal last week, we've seen a lot of questions about this update to Path of Exile. Check out the answers to some of the most frequently asked questions in today's news post.", "image": "images/poe-logo.png", "date": "2025-10-27T23:57:41Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "The aura is strong in this Pokémon GO and Mega Lucario celebration!", "url": "https://pokemongo.com/en/post/tcg-mega-lucario-ex/", "summary": "Trainers,", "image": "https://lh3.googleusercontent.com/xO_q8QpF-7jOG3R-YCbZ_LQ_YYGGYxBcjo1paKNyG86QN4F5g3G-hIcnu8vyaWSeNFCiXPzVX5AvmJKy3YOff0nRTfYwNAHW5oWQN3gRK_wsJw=s2400-rj", "date": "2025-10-27T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}, {"title": "Path of Exile: Keepers of The Flame - Bloodline Ascendancy Classes", "url": "https://www.pathofexile.com/forum/view-thread/3869178", "summary": "In Path of Exile: Keepers of the Flame, you will be able to absorb the abilities of the certain bosses you defeat, in the form of additional Bloodline Ascendancy Classes. Find out more in today's new post.", "image": "images/poe-logo.png", "date": "2025-10-26T19:00:00Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Announcing Path of Exile: Keepers of The Flame", "url": "https://www.pathofexile.com/forum/view-thread/3869036", "summary": "We're excited to bring you the announcements from GGG Live, where we’ll be revealing our new Path of Exile expansion, Keepers of The Flame! In this news post we've put together links to everything that is being announced during the www.twitch.tv/pathofexile livestream. We'll be updating this news post for your reference as the livestream progresses.", "image": "images/poe-logo.png", "date": "2025-10-23T19:00:34Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame Livestream Twitch Drops", "url": "https://www.pathofexile.com/forum/view-thread/3868556", "summary": "Jeepers Keepers! A creepy crawly Twitch drop will be available during the Keepers of the Flame content reveal. Get the Hiveborn Crawler Pet for free by tuning into GGG Live at 12pm on October 23rd (PDT). Check out today's news post for more information.", "image": "images/poe-logo.png", "date": "2025-10-20T20:45:01Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Path of Exile: Keepers of the Flame Teasers", "url": "https://www.pathofexile.com/forum/view-thread/3867910", "summary": "In this post we will compile all the Path of Exile: Keepers of the Flame teasers as they're posted. The most recent will always be at the top.", "image": "images/poe-logo.png", "date": "2025-10-17T18:57:16Z", /* Config */
const PAGE_SIZE = 30;
const SIDE_HERO_COUNT = 2; 
let currentPage = 1;

/* helpers */
function toLocal(utc) {
  if (!utc) return "";
  try { const d = new Date(utc); return d.toLocaleString(); } catch(e) { return utc; }
}
function isLogoLike(url, srcName) {
  // Treat only explicit PoE logos as "logo-fit"; everything else fills
  if (!url) return false;
  const low = String(url).toLowerCase();
  if (low.includes("poe-logo") || low.includes("pathofexile")) return true;
  if (srcName && String(srcName).toLowerCase().includes("poe")) return true;
  return false;
}
function normalizeSource(raw){
  const s = (raw||"").toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
  if (!s) return "Other";
  if (s === "blizzard" || s === "battlenet" || s === "battlenetcom" || s === "battle" || s === "battlenetnews") return "Blizzard";
  if (s === "poe" || s === "pathofexile" || s === "pathof_exile") return "Path of Exile";
  if (s === "pokemongo" || s === "pokemon" || s === "pokemongolive" || s === "pokémon_go" || s === "pokemon_go") return "Pokémon GO";
  return (raw||"").replace(/\b\w/g, c => c.toUpperCase());
}
function categoryOf(a){
  const src = normalizeSource(a.source || "");
  if (src === "Blizzard" && a.subheading) return a.subheading; // split Blizzard by game
  return src || "Other";
}

/* init & filters */
function init() {
  buildFilterChips();
  document.getElementById("searchInput").addEventListener("input", () => { currentPage = 1; applyFilters(); });
  document.getElementById("sortSelect").addEventListener("change", () => { currentPage = 1; applyFilters(); });
  document.getElementById("loadMore").addEventListener("click", () => {
    currentPage += 1;
    renderGrid(getFilteredArticles());
  });
  applyFilters();
  startAutoplay();
}
function buildFilterChips() {
  const container = document.getElementById("filters");
  const cats = Array.from(new Set(ARTICLES.map(categoryOf))).sort();
  const state = buildFilterChips.state || (buildFilterChips.state = { selected: new Set(cats) });

  container.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (state.selected.has(c) ? " active" : "");
    b.textContent = c;
    b.dataset.val = c;
    b.addEventListener("click", () => {
      b.classList.toggle("active");
      if (state.selected.has(c)) state.selected.delete(c); else state.selected.add(c);
      currentPage = 1;
      applyFilters();
    });
    container.appendChild(b);
  });
}
function getSelectedFilters() { const s = buildFilterChips.state?.selected; return s ? Array.from(s) : []; }
function getFilteredArticles() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const selected = getSelectedFilters();
  let filtered = ARTICLES.filter(a => {
    if (!a || !a.url) return false;
    const cat = categoryOf(a);
    if (selected.length && !selected.includes(cat)) return false;
    if (q) {
      const hay = ((a.title||"") + " " + (a.summary||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const sort = document.getElementById("sortSelect").value;
  if (sort === "new") filtered.sort((x,y)=> new Date(y.date||0) - new Date(x.date||0));
  else if (sort === "old") filtered.sort((x,y)=> new Date(x.date||0) - new Date(y.date||0));
  else if (sort === "az") filtered.sort((x,y)=> (x.title||"").localeCompare(y.title||""));
  else if (sort === "za") filtered.sort((x,y)=> (y.title||"").localeCompare(x.title||""));
  if (filtered.length && renderMainHeroAndSide.stateIdx >= filtered.length) renderMainHeroAndSide.stateIdx = 0;
  return filtered;
}

/* hero (main + side X) */
function renderMainHeroAndSide(filtered) {
  const mainEl = document.getElementById("mainHero");
  const sideGrid = document.getElementById("sideGrid");
  mainEl.innerHTML = "";
  sideGrid.innerHTML = "";
  if (!filtered.length) return;

  const n = filtered.length;
  const idx = renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) % n + n) % n;

  const mainArticle = filtered[idx];

  // Main hero image & overlay
  const mImg = document.createElement("img");
  mImg.alt = mainArticle.title || "";
  mImg.src = mainArticle.image || "";
  if (isLogoLike(mainArticle.image, mainArticle.source)) mImg.classList.add("logo-fit");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const mTitle = document.createElement("div");
  mTitle.className = "title clamp-2";
  mTitle.innerText = mainArticle.title || "(no title)";
  const mMeta = document.createElement("div");
  mMeta.className = "meta clamp-1";
  mMeta.innerText = (mainArticle.subheading || normalizeSource(mainArticle.source) || "") + " • " + toLocal(mainArticle.date);
  const mSumm = document.createElement("div");
  mSumm.className = "summary clamp-3";
  mSumm.innerText = mainArticle.summary || "";
  overlay.appendChild(mTitle);
  overlay.appendChild(mMeta);
  overlay.appendChild(mSumm);
  mainEl.appendChild(mImg);
  mainEl.appendChild(overlay);
  mainEl.onclick = () => { window.open(mainArticle.url, "_blank"); };

  // Prev/Next buttons
  const prev = document.createElement("button");
  prev.className = "hero-nav hero-prev";
  prev.setAttribute("aria-label","Previous featured article");
  prev.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  prev.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(-1); });
  const next = document.createElement("button");
  next.className = "hero-nav hero-next";
  next.setAttribute("aria-label","Next featured article");
  next.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  next.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(1); });
  mainEl.appendChild(prev);
  mainEl.appendChild(next);

  // Side heroes (count configurable)
  const sideCount = Math.min(SIDE_HERO_COUNT, n - 1);
  for (let i=1;i<=sideCount;i++){
    const a = filtered[(idx + i) % n];

    const card = document.createElement("div");
    card.className = "side-hero";

    const media = document.createElement("div");
    media.className = "side-hero-media";
    const img = document.createElement("img");
    img.alt = a.title || "";
    img.src = a.image || "";
    if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
    media.appendChild(img);

    const body = document.createElement("div");
    body.className = "side-hero-body";

    const title = document.createElement("div");
    title.className = "side-hero-title clamp-2";
    title.innerText = a.title || "(no title)";

    const summ = document.createElement("div");
    summ.className = "side-hero-summary clamp-3 fade-tail";
    summ.innerText = a.summary || "";

    const meta = document.createElement("div");
    meta.className = "side-hero-meta clamp-1";
    meta.innerText = (a.subheading || normalizeSource(a.source) || "") + " • " + toLocal(a.date);

    body.appendChild(title);
    body.appendChild(summ);
    body.appendChild(meta);

    card.appendChild(media);
    card.appendChild(body);
    card.onclick = () => { window.open(a.url, "_blank"); };

    sideGrid.appendChild(card);
  }
}

/* grid rendering with pagination */
function makeCard(a) {
  const card = document.createElement("article");
  card.className = "card";
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const img = document.createElement("img");
  img.alt = a.title || "";
  img.src = a.image || "";
  if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
  thumb.appendChild(img);

  const body = document.createElement("div");
  body.className = "card-body";
  const meta = document.createElement("div");
  meta.className = "card-meta";
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = ((normalizeSource(a.source) === "Blizzard") && a.subheading) ? a.subheading : normalizeSource(a.source);
  meta.appendChild(tag);
  const dt = document.createElement("div");
  dt.className = "badge";
  dt.textContent = toLocal(a.date);
  meta.appendChild(dt);

  const title = document.createElement("a");
  title.className = "card-title clamp-2";
  title.href = a.url;
  title.target = "_blank";
  title.rel = "noopener noreferrer";
  title.innerText = a.title || "(no title)";

  const summ = document.createElement("div");
  summ.className = "card-summary clamp-3";
  summ.innerText = a.summary || "";

  body.appendChild(meta);
  body.appendChild(title);
  body.appendChild(summ);

  card.appendChild(thumb);
  card.appendChild(body);

  card.addEventListener("click", () => { window.open(a.url, "_blank"); });

  return card;
}

function renderGrid(filtered){
  const grid = document.getElementById("feedGrid");
  const pager = document.getElementById("pager");
  grid.innerHTML = "";

  if (!filtered.length){
    document.getElementById("empty").style.display = "block";
    pager.style.display = "none";
    return;
  } else {
    document.getElementById("empty").style.display = "none";
  }

  const total = filtered.length;
  const showing = Math.min(total, currentPage * PAGE_SIZE);
  for (let i = 0; i < showing; i++){
    grid.appendChild(makeCard(filtered[i]));
  }

  // Pager visibility
  if (showing < total){
    pager.style.display = "flex";
  } else {
    pager.style.display = "none";
  }
}

/* filtering + autoplay */
function applyFilters() {
  const filtered = getFilteredArticles();
  renderMainHeroAndSide(filtered);
  renderGrid(filtered);
}
function startAutoplay(){ stopAutoplay(); startAutoplay.timer = setInterval(()=>{ shiftHero(1); }, 6000); }
function stopAutoplay(){ if (startAutoplay.timer){ clearInterval(startAutoplay.timer); startAutoplay.timer = null; } }
function shiftHero(delta){
  const filtered = getFilteredArticles();
  if (!filtered.length) return;
  renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) + delta + filtered.length) % filtered.length;
  renderMainHeroAndSide(filtered);
}

init();
