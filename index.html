<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GameFeed — Dev News</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#021025;
  --card:#0b1320;
  --muted:#9aa6b2;
  --accent:#60a5fa;
  --accent-2:#38bdf8;
  --radius:10px;
  --image-focal-y: 12%; /* how far down from the top to center the crop (0% = very top) */

  /* Your tuned ratios — tweak here */
  --main-hero-height: 532px;
  --side-hero-width: 360px;

  /* Side hero sizing */
  --side-hero-row-h: 260px;
  --side-hero-media-h: 130px;
}

/* Base */
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;background:linear-gradient(180deg,#021025,#071225 60%);color:#eaf0fb}
.container{max-width:1200px;margin:24px auto;padding:0 18px}

/* Header & controls */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:8px;background:var(--accent);color:#03213a;display:flex;align-items:center;justify-content:center;font-weight:700}
.title{font-size:18px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.top-controls{display:flex;gap:12px;align-items:center}
.search{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:8px}
.search input{background:transparent;border:0;outline:none;color:inherit;width:220px;font-size:14px}
.select{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:8px;color:var(--muted)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 8px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.active{background:rgba(96,165,250,0.08);color:var(--accent);border-color:rgba(96,165,250,0.14)}

/* Section titles */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.section-title{font-weight:800;font-size:20px;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.section-sub{color:var(--muted);font-size:12px}

/* Layout */
.layout{display:flex;gap:16px;margin-top:8px}

/* Clamp */
.clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ===== MAIN HERO ===== */
.main-hero{
  position:relative; flex:1; height:var(--main-hero-height);
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04); cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.main-hero:hover{transform:translateY(-8px);box-shadow:0 28px 56px rgba(2,6,23,0.7)}
.main-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.main-hero img.logo-fit{object-fit:contain; padding:0}
.main-hero .overlay{
  position:absolute; left:0; right:0; bottom:0; padding:16px;
  background:linear-gradient(180deg, rgba(2,16,37,0) 0%, rgba(2,16,37,0.6) 35%, rgba(2,16,37,0.9) 100%);
}
.main-hero .title{font-size:22px;font-weight:800;margin:0 0 6px 0}
.main-hero .meta{color:#c5d2e0;font-size:13px;margin-bottom:6px}
.main-hero .summary{color:#eaf0fb;font-size:14px}

/* Hero arrows */
.hero-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:999px;
  background:rgba(9,16,29,0.55); border:1px solid rgba(255,255,255,0.2);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(4px);
  cursor:pointer; user-select:none;
  transition:background .15s ease, transform .15s ease, opacity .15s ease;
  opacity:.88;
}
.hero-nav:hover{background:rgba(9,16,29,0.7); transform:translateY(-50%) scale(1.05)}
.hero-prev{left:12px}
.hero-next{right:12px}
.hero-nav svg{pointer-events:none}

/* ===== SIDE HEROES ===== */
.side-wrap{width:var(--side-hero-width);display:flex;flex-direction:column;gap:10px}
.side-grid{display:grid;gap:12px;grid-auto-rows: var(--side-hero-row-h)}
.side-hero{
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04);
  cursor:pointer; transition:transform .18s ease,box-shadow .18s ease;
  display:flex; flex-direction:column; min-height:0;
}
.side-hero:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(2,6,23,0.5)}
.side-hero-media{position:relative; flex:0 0 var(--side-hero-media-h); background:#061025}
.side-hero-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% var(--image-focal-y); display:block}
.side-hero-media img.logo-fit{object-fit:contain; padding:0}
.side-hero-body{flex:1 1 auto; min-height:0; overflow:hidden; padding:10px; display:flex; flex-direction:column; gap:6px}
.side-hero-title{font-size:16px;font-weight:800;margin:0;line-height:1.2}
.side-hero-summary{color:#eaf0fb;font-size:13px;line-height:1.35}
.side-hero-meta{color:#c5d2e0;font-size:12px; margin-top:auto}

/* Fade tail for clamped summary */
.fade-tail{
  mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}

/* Grid cards */
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.02);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(2,6,23,0.6)}
.thumb{width:100%;height:0;padding-bottom:56.25%;position:relative;background:#061025}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.logo-fit{object-fit:contain;padding:0}
.card-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.card-title{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.tag{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.card-summary{color:#dfe9f5;font-size:14px;line-height:1.3}

/* Pager */
.pager{display:flex;justify-content:center;margin:22px 0}
.btn{
  padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.02);color:#eaf0fb;font-size:14px;cursor:pointer;
}
.btn:hover{background:rgba(255,255,255,0.06)}

/* responsive */
@media(max-width:900px){
  .layout{flex-direction:column}
  .side-wrap{width:100% !important}
  .side-grid{grid-auto-rows: 260px}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">
      <div class="logo">GF</div>
      <div>
        <div class="title">GameFeed</div>
        <div class="subtitle">Direct from devs — Blizzard • Pokémon GO • Path of Exile</div>
      </div>
    </div>

    <div class="top-controls">
      <div class="search" title="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35" stroke="#9aa6b2" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Search title or summary..." aria-label="Search articles" />
      </div>

      <select id="sortSelect" class="select" title="Sort">
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Filter</div>
      <div id="filters" class="filters"></div>
    </div>
    <div style="text-align:right;color:var(--muted)"></div>
  </div>

  <div class="section-head">
    <div class="section-title">Featured Headlines</div>
    <div class="section-sub">Auto-rotating through top stories</div>
  </div>

  <main class="layout" role="main" aria-label="News hero and feed">
    <section class="main-hero" id="mainHero" tabindex="0" aria-label="Featured main article"></section>

    <section class="side-wrap" aria-label="Featured">
      <div class="side-grid" id="sideGrid" aria-live="polite"></div>
    </section>
  </main>

  <div class="section-title" style="margin-top:22px">Latest News</div>

  <section class="grid" id="feedGrid" aria-live="polite" aria-label="All news articles"></section>

  <div id="empty" style="display:none;text-align:center;color:var(--muted);padding:40px">No articles match your filters.</div>

  <div class="pager" id="pager" style="display:none">
    <button id="loadMore" class="btn" aria-label="Load more articles">Load more</button>
  </div>

  <div class="footer" style="display:none">Built with ❤️ — uses news.json</div>
</div>

<script>
const ARTICLES = [{"title": "Black Ops 7 Ready for Launch: Multiplayer Maps and Modes", "url": "https://news.blizzard.com/en-us/article/24246202/black-ops-7-ready-for-launch-multiplayer-maps-and-modes", "summary": "Declassified information confirms all 19 maps coming to Black Ops 7 before the start of Season 01, along with every launch mode. Plus, intel on every Operator, and how to obtain them when Black Ops 7 launches on November 14.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/74/74UFPIS68RXY1762365661674.jpg", "date": "2025-11-05T18:00:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "Get ready: BlizzCon early bird passes go on sale November 7", "url": "https://news.blizzard.com/en-us/article/24245211/get-ready-blizzcon-early-bird-passes-go-on-sale-november-7", "summary": "Early bird passes will be available on November 7, 2025, at a special rate.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blta818a51eed439bcc/6909291304242639d85eb0fc/Battle.net_App_Notification.jpg", "date": "2025-11-05T17:01:46Z", "subheading": "Blizzard", "game": "Blizzard", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/bltbd6b3637d77c60f0/5da8a74e9147457fdde5f6d3/blizzard.svg", "source": "blizzard"}, {"title": "Black Ops 7: PC Trailer, Specs, and More", "url": "https://news.blizzard.com/en-us/article/24243440/black-ops-7-pc-trailer-specs-and-more", "summary": "Get ready for the November 14 launch of Call of Duty: Black Ops 7 on PC with specs for Minimum, Recommended, Competitive/Ultra 4K performance in addition to preloading times, recommended drivers, and a preview of handheld enhancements that keep the action flowing even when you’re on the go.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/8o/8OLP51KI1VNF1762364506864.jpg", "date": "2025-11-05T17:00:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "Legion Remix: Legionfall Now Live!", "url": "https://news.blizzard.com/en-us/article/24239491/legion-remix-legionfall-now-live", "summary": "Get ready for fast frenetic fun in Legion Remix as you meet up with the infinite dragonflight once more, level new characters, and earn a variety of items to add to your collection. Establish a foothold on the Broken Shore, take on Legion Assaults, and fight your way into the Cathedral of Eternal Night and the Tomb of Sargeras.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/pn/PNC6I2FWZVSO1762296436476.jpg", "date": "2025-11-04T22:45:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Start your journey through the ages", "url": "https://news.blizzard.com/en-us/article/24245210/start-your-journey-through-the-ages", "summary": "Unite champions from past, future, and beyond to fight for what is, was, and could be.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt3f1872e7b74e2f43/69029baa44af3e5074c75d68/HS_34p0_AtTW_NowLive_PHX-Gametab-Carousel-Standard-1920x1080_LZO01_(1).png", "date": "2025-11-04T17:45:00Z", "subheading": "Hearthstone", "game": "Hearthstone", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt05905fb295358316/5d48a37efbf0e17fc6dafd3c/hearthstone.svg", "source": "blizzard"}, {"title": "Hotfixes: November 3, 2025", "url": "https://news.blizzard.com/en-us/article/24240525/hotfixes-november-3-2025", "summary": "Here you will find a list of hotfixes that address various issues related to World of Warcraft: The War Within, Mists of Pandaria Classic, Season of Discovery, WoW Classic Era, and Hardcore.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/gy/GYJ2HU58PDSP1760044520515.png", "date": "2025-11-04T01:05:18Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Dawn of the Hunt Mystery Box Microtransactions Now Available in Store", "url": "https://www.pathofexile.com/forum/view-thread/3873143", "summary": "The Dawn of the Hunt Mystery Box microtransactions are now available for purchase in both Path of Exile 1 and 2. If you missed getting anything from opening the Mystery Boxes, now's your chance to get it!", "image": "images/poe-logo.png", "date": "2025-11-03T23:42:01Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Heroes of the Storm PTR Patch Notes - November 3, 2025", "url": "https://news.blizzard.com/en-us/article/24242860/heroes-of-the-storm-ptr-patch-notes-november-3-2025", "summary": "Our next Heroes of the Storm patch has just hit the Public Test Realm and will be available for playtesting.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blta3d6e578dc31a812/6908d9eb27dd8848bd8af591/Launcher-Social_1920x1080.png", "date": "2025-11-03T17:11:00Z", "subheading": "Heroes of the Storm", "game": "Heroes of the Storm", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt338ef9c751599624/5d48a37e0927f67fc054705f/heroes-of-the-storm.svg", "source": "blizzard"}, {"title": "What We're Working On", "url": "https://www.pathofexile.com/forum/view-thread/3872574", "summary": "The launch of Path of Exile: Keepers of the Flame over the weekend was one of our smoothest launches ever. Thanks to everyone who logged in to try it out! Check out today's news post for more information on what we're working on.", "image": "images/poe-logo.png", "date": "2025-11-03T01:22:28Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Keepers of the Flame Launch - Live Updates 🔴", "url": "https://www.pathofexile.com/forum/view-thread/3870904", "summary": "The Path of Exile: Keepers of the Flame expansion has launched! We'll be updating this thread live throughout the day with any relevant info you may need about the expansion's deployment.", "image": "images/poe-logo.png", "date": "2025-10-31T19:01:09Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "WoW Weekly: The Midnight Beta is Nigh, November's Bountiful Trading Post, and More!", "url": "https://news.blizzard.com/en-us/article/24242429/wow-weekly-the-midnight-beta-is-nigh-november-s-bountiful-trading-post-and-more", "summary": "Adventure is calling you home when the Midnight beta arrives on November 11, bountiful goods await in November's Trading Post, and Midnight Alpha Phase 5 is ready for testing! Every week brings thrilling new adventures and loot, so rally your allies and forge your legend in Azeroth.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/6p/6P6JF13X5SQH1761924307123.png", "date": "2025-10-31T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Celebrate with the Dead During Day of the Dead!", "url": "https://news.blizzard.com/en-us/article/22646756/celebrate-with-the-dead-during-day-of-the-dead", "summary": "The time has come once more to gather in the graveyards for the Day of the Dead and celebrate with and cherish the spirits of those who have been lost.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/q3/Q31EWZIXTZEZ1477972664809.jpg", "date": "2025-10-31T16:59:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Weekly Recall: Developer Horror Stories", "url": "https://news.blizzard.com/en-us/article/24243209/weekly-recall-developer-horror-stories", "summary": "This Halloween, you’re in for a fright as our devs gather ‘round the fire’s light to share tall tales of bluffs, bugs, and crashes, audio breakdowns, and hotly-fixed patches. Keep the lights on or risk Team 4’s curse: maybe you’ll do this tomorrow at work.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/8p/8PTFICW7XQ901761869132946.png", "date": "2025-10-31T16:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Challenge Rewards", "url": "https://www.pathofexile.com/forum/view-thread/3870709", "summary": "In the Keepers League, you’ll be able to earn a set of exclusive microtransactions themed around the Keepers of the Flame expansion by completing 40 new challenges. Find out more in today's news post!", "image": "images/poe-logo.png", "date": "2025-10-31T01:30:32Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Path of Exile: Keepers of the Flame Launches Soon", "url": "https://www.pathofexile.com/forum/view-thread/3870689", "summary": "Path of Exile: Keepers of the Flame will launch on PC and Console soon! In this news post, we’ve gathered all the information you need to know about what happens on launch day and how to start downloading early.", "image": "images/poe-logo.png", "date": "2025-10-30T23:59:24Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "New and Changed Gems in Path of Exile: Keepers of the Flame", "url": "https://www.pathofexile.com/forum/view-thread/3870620", "summary": "Path of Exile: Keepers of The Flame introduces several new Gems available and some changes to existing Skill and Support Gems. Check out the list in today's news post.", "image": "images/poe-logo.png", "date": "2025-10-30T21:07:01Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "November’s Trading Post is a Bountiful Thing!", "url": "https://news.blizzard.com/en-us/article/24244396/novembers-trading-post-is-a-bountiful-thing", "summary": "You’ll find a cornucopia of collectible, delicious delights when you visit the November Trading Post. If you like the color orange and wearable culinary fair, then this one’s for you. Participate in a bounty of activities to collect this month’s reward—the Prized Turkey mount. You’ll want to gobble up all the new items.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/lq/LQECQLY119UU1761255075807.png", "date": "2025-10-30T19:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "[Updated 10/30] Midnight Prologue: \"The Warning\" Content Update and Housing Early Access", "url": "https://news.blizzard.com/en-us/article/24241096/updated-10-30-midnight-prologue-the-warning-content-update-and-housing-early-access", "summary": "With the Ghosts of K’aresh behind us, Azeroth stands on the precipice of a future overshadowed by Xal’atath and the relentless advance of the Void. In The Warning, the stage is set for what comes next before continuing the story in the Midnight expansion. Players will also be welcomed home with the start of Housing Early Access!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/94/9492L2087ZBT1759970906337.png", "date": "2025-10-30T17:30:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "The Infernal Hordes Blazes with Compass to Carnage", "url": "https://news.blizzard.com/en-us/article/24243858/the-infernal-hordes-blazes-with-compass-to-carnage", "summary": "For a limited time, earn increased Infernal Compasses and endure more Chaos Waves in Compass to Carnage.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/bltd0681f6a2012cac4/690145ba299f68751b657971/CompToCarnage_Blog_1920x1080_ab01_(1)_(1).png", "date": "2025-10-30T17:00:00Z", "subheading": "Diablo IV", "game": "Diablo IV", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt95aebf4d119210f5/5e543f7e8dc1e51c53168b7a/games-d4-colored.svg", "source": "blizzard"}, {"title": "The Midnight Beta Test Goes Live November 11", "url": "https://news.blizzard.com/en-us/article/24245100/the-midnight-beta-test-goes-live-november-11", "summary": "Over the course of the test, we'll be inviting community veterans, press, fansites, friends, and family to check out the upcoming expansion and give us feedback. Players who pre-purchase or who upgrade to the Epic Edition of Midnight will also gain access to the beta and three-day early access to the expansion.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/rk/RK1VLHXL3PSJ1761694514707.png", "date": "2025-10-30T16:55:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Launch Twitch Drops", "url": "https://www.pathofexile.com/forum/view-thread/3870472", "summary": "Celebrate the launch of Path of Exile: Keepers of the Flame with us by tuning into your favorite Twitch stream! We’ll be running two weeks of Twitch Drops, including a special drop campaign for community streamers. Find out more in this news post!", "image": "images/poe-logo.png", "date": "2025-10-30T01:34:09Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "The Outer Worlds 2 is live! Find out what kind of Earth Directorate agent you really are", "url": "https://news.blizzard.com/en-us/article/24244022/the-outer-worlds-2-is-live-find-out-what-kind-of-earth-directorate-agent-you-really-are", "summary": "You’ve trained for this. You’ve read the briefings. You’ve probably ignored most of them. Now it’s time to find out what kind of Earth Directorate agent you really are.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt321780c8dd6d4fe6/68f2bdd04901770d0110b38c/phx_news_media_arkansas_crew.webp", "date": "2025-10-29T17:00:00Z", "subheading": "The Outer Worlds 2", "game": "The Outer Worlds 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/bltfe165e21e017f978/68efd6f8b5da2d4a4a224c65/game_icon_arkansas.svg", "source": "blizzard"}, {"title": "In Development: Phase Five of the Midnight Alpha", "url": "https://news.blizzard.com/en-us/article/24244639/in-development-phase-five-of-the-midnight-alpha", "summary": "Phase five of the Midnight Alpha is here and, with it, players in the test can play at level 90, explore more story and quests, battle through Delves, hunt Prey, and more.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/77/77L3M3EAI7JN1761349922599.png", "date": "202 /forum/view-thread/3870059", "summary": "Following the Keepers of the Flame Content Reveal last week, we've seen a lot of questions about this update to Path of Exile. Check out the answers to some of the most frequently asked questions in today's news post.", "image": "images/poe-logo.png", "date": "2025-10-27T23:57:41Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Countdown to a new expansion, kick off a new Arena season, and more", "url": "https://news.blizzard.com/en-us/article/24243857/countdown-to-a-new-expansion-kick-off-a-new-arena-season-and-more", "summary": "Check out the details on the launch of Across the Timeways, a new Arena season, and much more!", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt2fdf72e7afeb595c/68fbfa13c39996ce371cf9fa/HS_34p0_Patch_Notes_BattleNet_App_CrossPromoStatic_1920x1080_LZO01.jpg", "date": "2025-10-27T16:45:00Z", "subheading": "Hearthstone", "game": "Hearthstone", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt05905fb295358316/5d48a37efbf0e17fc6dafd3c/hearthstone.svg", "source": "blizzard"}, {"title": "Rise the Ranks in the Bout of Realms", "url": "https://news.blizzard.com/en-us/article/24244452/rise-the-ranks-in-the-bout-of-realms", "summary": "The Bout of Realms returns for you to assemble your most elite allies and rise the ranks.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt1e88a72fe9a08fad/69003f34a3d97be174f9de4e/Bout_of_Realms_1920_x_1080.png", "date": "2025-10-27T13:00:00Z", "subheading": "Diablo Immortal", "game": "Diablo Immortal", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt989ffb415ea874fa/6081aad335bb4d0cbd9c064b/D_Immortal_Icon.svg", "source": "blizzard"}, {"title": "The aura is strong in this Pokémon GO and Mega Lucario celebration!", "url": "https://pokemongo.com/en/post/tcg-mega-lucario-ex/", "summary": "Trainers,", "image": "https://lh3.googleusercontent.com/xO_q8QpF-7jOG3R-YCbZ_LQ_YYGGYxBcjo1paKNyG86QN4F5g3G-hIcnu8vyaWSeNFCiXPzVX5AvmJKy3YOff0nRTfYwNAHW5oWQN3gRK_wsJw=s2400-rj", "date": "2025-10-27T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}, {"title": "Path of Exile: Keepers of The Flame - Bloodline Ascendancy Classes", "url": "https://www.pathofexile.com/forum/view-thread/3869178", "summary": "In Path of Exile: Keepers of the Flame, you will be able to absorb the abilities of the certain bosses you defeat, in the form of additional Bloodline Ascendancy Classes. Find out more in today's new post.", "image": "images/poe-logo.png", "date": "2025-10-26T19:00:00Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Dive into Arcadia’s chaos—Early Access has arrived!", "url": "https://news.blizzard.com/en-us/article/24242858/dive-into-arcadias-chaosearly-access-has-arrived", "summary": "It’s happening! The Outer Worlds 2 Early Access is officially live for Premium Edition players— which means you can start finding what flaws you have, in a good way, five days early... Why wait for the rest of the Earth Directorate to catch up when you can dive straight into Arcadia’s chaos today?", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt599ece53577e2824/68f2b910acfe31d5cd4e392f/phx_news_media_arkansas_central_interface.webp", "date": "2025-10-24T17:00:00Z", "subheading": "The Outer Worlds 2", "game": "The Outer Worlds 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/bltfe165e21e017f978/68efd6f8b5da2d4a4a224c65/game_icon_arkansas.svg", "source": "blizzard"}, {"title": "WoW Weekly: Legion Remix, Mythic Dungeon International, Turbo Boost, and More!", "url": "https://news.blizzard.com/en-us/article/24242428/wow-weekly-legion-remix-mythic-dungeon-international-turbo-boost-and-more", "summary": "Fast, frenetic fun awaits in Legion Remix, our most-celebrated MDI champions and contenders return to shatter records, and more! Every week brings thrilling new adventures and loot, so rally your allies and forge your legend in Azeroth.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/7p/7PCXGC0TF2XK1761255607833.png", "date": "2025-10-24T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "World of Warcraft Student Art Contest 2025", "url": "https://news.blizzard.com/en-us/article/24240670/world-of-warcraft-student-art-contest-2025", "summary": "Students, the time has come to show off your talents: The World of Warcraft Student Art Contest has returned!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/x5/X57W00K1CMJU1742490617181.jpg", "date": "2025-10-24T16:55:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Weekly Recall: Frighteningly Fabulous Fanart", "url": "https://news.blizzard.com/en-us/article/24244418/weekly-recall-frighteningly-fabulous-fanart", "summary": "There’s nothing better than spooky season in Overwatch! This week, the Community team wants to highlight the gorgeous and ghoulish art pieces that are keeping our festive spirits up.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/of/OF52MZY9Z2831761247958052.png", "date": "2025-10-24T16:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "Announcing Path of Exile: Keepers of The Flame", "url": "https://www.pathofexile.com/forum/view-thread/3869036", "summary": "We're excited to bring you the announcements from GGG Live, where we’ll be revealing our new Path of Exile expansion, Keepers of The Flame! In this news post we've put together links to everything that is being announced during the www.twitch.tv/pathofexile livestream. We'll be updating this news post for your reference as the livestream progresses.", "image": "images/poe-logo.png", "date": "2025-10-23T19:00:34Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "How Midnight’s Upcoming Game Changes Will Impact Combat Addons", "url": "https://news.blizzard.com/en-us/article/24244638/how-midnights-upcoming-game-changes-will-impact-combat-addons", "summary": "The journey to update World of Warcraft’s combat experience continues, with a focus on making gameplay more intuitive and approachable—without requiring addons. In the Midnight expansion, we’re working closely with addon authors and taking in community feedback to create a more streamlined and engaging combat experience for everyone. The World of Warcraft development team shares the guiding principles behind these updates, focusing on ongoing customization and increased accessibility whether players choose to use addons or not.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/t8/T8QJDWCF1T2Y1755621947838.png", "date": "2025-10-23T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Livestream Twitch Drops", "url": "https://www.pathofexile.com/forum/view-thread/3868556", "summary": "Jeepers Keepers! A creepy crawly Twitch drop will be available during the Keepers of  "pokemongo"}, {"title": "Fossil Research Day! – Pokémon GO", "url": "https://pokemongo.com/en/post/fossil-research-day-2025/", "summary": "Saturday, August 2, 2025, from 2:00 p.m. to 5:00 p.m. local time", "image": "https://lh3.googleusercontent.com/Fs2GvtQ9mGcLzQLnbNINtuyEGg7Q6UuLCInrxVzU-mvQ2EjnyzELk5-xlJ930Ex49HcqJ3gfj-f73bMgXWFDXieFE_lPcXe9qjCwsUBOu1LqfQ=s2400-rj", "date": "2025-07-23T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}, {"title": "Pokémon GO Adventure Week returns, get out and explore!", "url": "https://pokemongo.com/en/post/adventure-week-2025/", "summary": "Tuesday, July 29, at 10:00 a.m. to Sunday, August 3, 2025, at 8:00 p.m. local time", "image": "https://lh3.googleusercontent.com/LsY_E2fHqrTI4lOMS1IjqVg0yvPSrsdLLsDWz_m6ad06Tcj03YMvIPd6NGi4OzYdJ0R_aIk18XcIDGszTM8_8SR8UG3YrQTL-6xno0RQrHO14A=s2400-rj", "date": "2025-07-16T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}, {"title": "Get ready for Summer Concert, a music-themed celebration! – Pokémon GO", "url": "https://pokemongo.com/en/post/pokemongo-summer-concert-2025/", "summary": "Saturday, July 19, to Tuesday, July 22, 2025, from 5:00 p.m.at 8:00 p.m. local time each day", "image": "https://lh3.googleusercontent.com/b1nTAKER5wogwm7Bc5DTozujL8mz3x8COz4B4VGGwqqEIEH3tn1CffLqQ2wLyX4blDsQ9Mfm9xaCXkq1nTfllIzHScAfVRQIQGmCqqt-f_3UFmU=s2400-rj", "date": "2025-07-11T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}];

/* Config */
const PAGE_SIZE = 30;
const SIDE_HERO_COUNT = 2; 
let currentPage = 1;

/* helpers */
function toLocal(utc) {
  if (!utc) return "";
  try { const d = new Date(utc); return d.toLocaleString(); } catch(e) { return utc; }
}
function isLogoLike(url, srcName) {
  // Treat only explicit PoE logos as "logo-fit"; everything else fills
  if (!url) return false;
  const low = String(url).toLowerCase();
  if (low.includes("poe-logo") || low.includes("pathofexile")) return true;
  if (srcName && String(srcName).toLowerCase().includes("poe")) return true;
  return false;
}
function normalizeSource(raw){
  const s = (raw||"").toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
  if (!s) return "Other";
  if (s === "blizzard" || s === "battlenet" || s === "battlenetcom" || s === "battle" || s === "battlenetnews") return "Blizzard";
  if (s === "poe" || s === "pathofexile" || s === "pathof_exile") return "Path of Exile";
  if (s === "pokemongo" || s === "pokemon" || s === "pokemongolive" || s === "pokémon_go" || s === "pokemon_go") return "Pokémon GO";
  return (raw||"").replace(/\b\w/g, c => c.toUpperCase());
}
function categoryOf(a){
  const src = normalizeSource(a.source || "");
  if (src === "Blizzard" && a.subheading) return a.subheading; // split Blizzard by game
  return src || "Other";
}

/* init & filters */
function init() {
  buildFilterChips();
  document.getElementById("searchInput").addEventListener("input", () => { currentPage = 1; applyFilters(); });
  document.getElementById("sortSelect").addEventListener("change", () => { currentPage = 1; applyFilters(); });
  document.getElementById("loadMore").addEventListener("click", () => {
    currentPage += 1;
    renderGrid(getFilteredArticles());
  });
  applyFilters();
  startAutoplay();
}
function buildFilterChips() {
  const container = document.getElementById("filters");
  const cats = Array.from(new Set(ARTICLES.map(categoryOf))).sort();
  const state = buildFilterChips.state || (buildFilterChips.state = { selected: new Set(cats) });

  container.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (state.selected.has(c) ? " active" : "");
    b.textContent = c;
    b.dataset.val = c;
    b.addEventListener("click", () => {
      b.classList.toggle("active");
      if (state.selected.has(c)) state.selected.delete(c); else state.selected.add(c);
      currentPage = 1;
      applyFilters();
    });
    container.appendChild(b);
  });
}
function getSelectedFilters() { const s = buildFilterChips.state?.selected; return s ? Array.from(s) : []; }
function getFilteredArticles() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const selected = getSelectedFilters();
  let filtered = ARTICLES.filter(a => {
    if (!a || !a.url) return false;
    const cat = categoryOf(a);
    if (selected.length && !selected.includes(cat)) return false;
    if (q) {
      const hay = ((a.title||"") + " " + (a.summary||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const sort = document.getElementById("sortSelect").value;
  if (sort === "new") filtered.sort((x,y)=> new Date(y.date||0) - new Date(x.date||0));
  else if (sort === "old") filtered.sort((x,y)=> new Date(x.date||0) - new Date(y.date||0));
  else if (sort === "az") filtered.sort((x,y)=> (x.title||"").localeCompare(y.title||""));
  else if (sort === "za") filtered.sort((x,y)=> (y.title||"").localeCompare(x.title||""));
  if (filtered.length && renderMainHeroAndSide.stateIdx >= filtered.length) renderMainHeroAndSide.stateIdx = 0;
  return filtered;
}

/* hero (main + side X) */
function renderMainHeroAndSide(filtered) {
  const mainEl = document.getElementById("mainHero");
  const sideGrid = document.getElementById("sideGrid");
  mainEl.innerHTML = "";
  sideGrid.innerHTML = "";
  if (!filtered.length) return;

  const n = filtered.length;
  const idx = renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) % n + n) % n;

  const mainArticle = filtered[idx];

  // Main hero image & overlay
  const mImg = document.createElement("img");
  mImg.alt = mainArticle.title || "";
  mImg.src = mainArticle.image || "";
  if (isLogoLike(mainArticle.image, mainArticle.source)) mImg.classList.add("logo-fit");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const mTitle = document.createElement("div");
  mTitle.className = "title clamp-2";
  mTitle.innerText = mainArticle.title || "(no title)";
  const mMeta = document.createElement("div");
  mMeta.className = "meta clamp-1";
  mMeta.innerText = (mainArticle.subheading || normalizeSource(mainArticle.source) || "") + " • " + toLocal(mainArticle.date);
  const mSumm = document.createElement("div");
  mSumm.className = "summary clamp-3";
  mSumm.innerText = mainArticle.summary || "";
  overlay.appendChild(mTitle);
  overlay.appendChild(mMeta);
  overlay.appendChild(mSumm);
  mainEl.appendChild(mImg);
  mainEl.appendChild(overlay);
  mainEl.onclick = () => { window.open(mainArticle.url, "_blank"); };

  // Prev/Next buttons
  const prev = document.createElement("button");
  prev.className = "hero-nav hero-prev";
  prev.setAttribute("aria-label","Previous featured article");
  prev.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  prev.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(-1); });
  const next = document.createElement("button");
  next.className = "hero-nav hero-next";
  next.setAttribute("aria-label","Next featured article");
  next.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  next.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(1); });
  mainEl.appendChild(prev);
  mainEl.appendChild(next);

  // Side heroes (count configurable)
  const sideCount = Math.min(SIDE_HERO_COUNT, n - 1);
  for (let i=1;i<=sideCount;i++){
    const a = filtered[(idx + i) % n];

    const card = document.createElement("div");
    card.className = "side-hero";

    const media = document.createElement("div");
    media.className = "side-hero-media";
    const img = document.createElement("img");
    img.alt = a.title || "";
    img.src = a.image || "";
    if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
    media.appendChild(img);

    const body = document.createElement("div");
    body.className = "side-hero-body";

    const title = document.createElement("div");
    title.className = "side-hero-title clamp-2";
    title.innerText = a.title || "(no title)";

    const summ = document.createElement("div");
    summ.className = "side-hero-summary clamp-3 fade-tail";
    summ.innerText = a.summary || "";

    const meta = document.createElement("div");
    meta.className = "side-hero-meta clamp-1";
    meta.innerText = (a.subheading || normalizeSource(a.source) || "") + " • " + toLocal(a.date);

    body.appendChild(title);
    body.appendChild(summ);
    body.appendChild(meta);

    card.appendChild(media);
    card.appendChild(body);
    card.onclick = () => { window.open(a.url, "_blank"); };

    sideGrid.appendChild(card);
  }
}

/* grid rendering with pagination */
function makeCard(a) {
  const card = document.createElement("article");
  card.className = "card";
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const img = document.createElement("img");
  img.alt = a.title || "";
  img.src = a.image || "";
  if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
  thumb.appendChild(img);

  const body = document.createElement("div");
  body.className = "card-body";
  const meta = document.createElement("div");
  meta.className = "card-meta";
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = ((normalizeSource(a.source) === "Blizzard") && a.subheading) ? a.subheading : normalizeSource(a.source);
  meta.appendChild(tag);
  const dt = document.createElement("div");
  dt.className = "badge";
  dt.textContent = toLocal(a.date);
  meta.appendChild(dt);

  const title = document.createElement("a");
  title.className = "card-title clamp-2";
  title.href = a.url;
  title.target = "_blank";
  title.rel = "noopener noreferrer";
  title.innerText = a.title || "(no title)";

  const summ = document.createElement("div");
  summ.className = "card-summary clamp-3";
  summ.innerText = a.summary || "";

  body.appendChild(meta);
  body.appendChild(title);
  body.appendChild(summ);

  card.appendChild(thumb);
  card.appendChild(body);

  card.addEventListener("click", () => { window.open(a.url, "_blank"); });

  return card;
}

function renderGrid(filtered){
  const grid = document.getElementById("feedGrid");
  const pager = document.getElementById("pager");
  grid.innerHTML = "";

  if (!filtered.length){
    document.getElementById("empty").style.display = "block";
    pager.style.display = "none";
    return;
  } else {
    document.getElementById("empty").style.display = "none";
  }

  const total = filtered.length;
  const showing = Math.min(total, currentPage * PAGE_SIZE);
  for (let i = 0; i < showing; i++){
    grid.appendChild(makeCard(filtered[i]));
  }

  // Pager visibility
  if (showing < total){
    pager.style.display = "flex";
  } else {
    pager.style.display = "none";
  }
}

/* filtering + autoplay */
function applyFilters() {
  const filtered = getFilteredArticles();
  renderMainHeroAndSide(filtered);
  renderGrid(filtered);
}
function startAutoplay(){ stopAutoplay(); startAutoplay.timer = setInterval(()=>{ shiftHero(1); }, 6000); }
function stopAutoplay(){ if (startAutoplay.timer){ clearInterval(startAutoplay.timer); startAutoplay.timer = null; } }
function shiftHero(delta){
  const filtered = getFilteredArticles();
  if (!filtered.length) return;
  renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) + delta + filtered.length) % filtered.length;
  renderMainHeroAndSide(filtered);
}

init();
</script>
