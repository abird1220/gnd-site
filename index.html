<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GameFeed — Dev News</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#021025;
  --card:#0b1320;
  --muted:#9aa6b2;
  --accent:#60a5fa;
  --accent-2:#38bdf8;
  --radius:10px;
  --image-focal-y: 12%; /* how far down from the top to center the crop (0% = very top) */

  /* Your tuned ratios — tweak here */
  --main-hero-height: 532px;
  --side-hero-width: 360px;

  /* Side hero sizing */
  --side-hero-row-h: 260px;
  --side-hero-media-h: 130px;
}

/* Base */
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;background:linear-gradient(180deg,#021025,#071225 60%);color:#eaf0fb}
.container{max-width:1200px;margin:24px auto;padding:0 18px}

/* Header & controls */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:8px;background:var(--accent);color:#03213a;display:flex;align-items:center;justify-content:center;font-weight:700}
.title{font-size:18px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.top-controls{display:flex;gap:12px;align-items:center}
.search{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:8px}
.search input{background:transparent;border:0;outline:none;color:inherit;width:220px;font-size:14px}
.select{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:8px;color:var(--muted)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 8px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.active{background:rgba(96,165,250,0.08);color:var(--accent);border-color:rgba(96,165,250,0.14)}

/* Section titles */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.section-title{font-weight:800;font-size:20px;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.section-sub{color:var(--muted);font-size:12px}

/* Layout */
.layout{display:flex;gap:16px;margin-top:8px}

/* Clamp */
.clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ===== MAIN HERO ===== */
.main-hero{
  position:relative; flex:1; height:var(--main-hero-height);
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04); cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.main-hero:hover{transform:translateY(-8px);box-shadow:0 28px 56px rgba(2,6,23,0.7)}
.main-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.main-hero img.logo-fit{object-fit:contain; padding:0}
.main-hero .overlay{
  position:absolute; left:0; right:0; bottom:0; padding:16px;
  background:linear-gradient(180deg, rgba(2,16,37,0) 0%, rgba(2,16,37,0.6) 35%, rgba(2,16,37,0.9) 100%);
}
.main-hero .title{font-size:22px;font-weight:800;margin:0 0 6px 0}
.main-hero .meta{color:#c5d2e0;font-size:13px;margin-bottom:6px}
.main-hero .summary{color:#eaf0fb;font-size:14px}

/* Hero arrows */
.hero-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:999px;
  background:rgba(9,16,29,0.55); border:1px solid rgba(255,255,255,0.2);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(4px);
  cursor:pointer; user-select:none;
  transition:background .15s ease, transform .15s ease, opacity .15s ease;
  opacity:.88;
}
.hero-nav:hover{background:rgba(9,16,29,0.7); transform:translateY(-50%) scale(1.05)}
.hero-prev{left:12px}
.hero-next{right:12px}
.hero-nav svg{pointer-events:none}

/* ===== SIDE HEROES ===== */
.side-wrap{width:var(--side-hero-width);display:flex;flex-direction:column;gap:10px}
.side-grid{display:grid;gap:12px;grid-auto-rows: var(--side-hero-row-h)}
.side-hero{
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04);
  cursor:pointer; transition:transform .18s ease,box-shadow .18s ease;
  display:flex; flex-direction:column; min-height:0;
}
.side-hero:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(2,6,23,0.5)}
.side-hero-media{position:relative; flex:0 0 var(--side-hero-media-h); background:#061025}
.side-hero-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% var(--image-focal-y); display:block}
.side-hero-media img.logo-fit{object-fit:contain; padding:0}
.side-hero-body{flex:1 1 auto; min-height:0; overflow:hidden; padding:10px; display:flex; flex-direction:column; gap:6px}
.side-hero-title{font-size:16px;font-weight:800;margin:0;line-height:1.2}
.side-hero-summary{color:#eaf0fb;font-size:13px;line-height:1.35}
.side-hero-meta{color:#c5d2e0;font-size:12px; margin-top:auto}

/* Fade tail for clamped summary */
.fade-tail{
  mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}

/* Grid cards */
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.02);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(2,6,23,0.6)}
.thumb{width:100%;height:0;padding-bottom:56.25%;position:relative;background:#061025}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.logo-fit{object-fit:contain;padding:0}
.card-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.card-title{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.tag{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.card-summary{color:#dfe9f5;font-size:14px;line-height:1.3}

/* Pager */
.pager{display:flex;justify-content:center;margin:22px 0}
.btn{
  padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.02);color:#eaf0fb;font-size:14px;cursor:pointer;
}
.btn:hover{background:rgba(255,255,255,0.06)}

/* responsive */
@media(max-width:900px){
  .layout{flex-direction:column}
  .side-wrap{width:100% !important}
  .side-grid{grid-auto-rows: 260px}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">
      <div class="logo">GF</div>
      <div>
        <div class="title">GameFeed</div>
        <div class="subtitle">Direct from devs — Blizzard • Pokémon GO • Path of Exile</div>
      </div>
    </div>

    <div class="top-controls">
      <div class="search" title="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35" stroke="#9aa6b2" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Search title or summary..." aria-label="Search articles" />
      </div>

      <select id="sortSelect" class="select" title="Sort">
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Filter</div>
      <div id="filters" class="filters"></div>
    </div>
    <div style="text-align:right;color:var(--muted)"></div>
  </div>

  <div class="section-head">
    <div class="section-title">Featured Headlines</div>
    <div class="section-sub">Auto-rotating through top stories</div>
  </div>

  <main class="layout" role="main" aria-label="News hero and feed">
    <section class="main-hero" id="mainHero" tabindex="0" aria-label="Featured main article"></section>

    <section class="side-wrap" aria-label="Featured">
      <div class="side-grid" id="sideGrid" aria-live="polite"></div>
    </section>
  </main>

  <div class="section-title" style="margin-top:22px">Latest News</div>

  <section class="grid" id="feedGrid" aria-live="polite" aria-label="All news articles"></section>

  <div id="empty" style="display:none;text-align:center;color:var(--muted);padding:40px">No articles match your filters.</div>

  <div class="pager" id="pager" style="display:none">
    <button id="loadMore" class="btn" aria-label="Load more articles">Load more</button>
  </div>

  <div class="footer" style="display:none">Built with ❤️ — uses news.json</div>
</div>

all of Duty: Black Ops 7 approaches, Treyarch took the stage at Call of Duty: NEXT to give an in-depth look at Multiplayer, Zombies, and Call of Duty: Warzone. Plus, Call of Duty: Mobile turns 6, the competition heats up with Call of Duty Endowment (C.O.D.E.) Bowl VI and the World Series of Warzone Global Finals is here!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/qv/QVLQU9DEB6V51759358125431.jpg", "date": "2025-10-01T22:36:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "Black Ops 7 Beta — Everything You Need to Know", "url": "https://news.blizzard.com/en-us/article/24239908/black-ops-7-beta-everything-you-need-to-know", "summary": "Get ready to jump into the Call of Duty: Black Ops 7 Multiplayer and Zombies Beta with our complete guide. Learn essential tactics for every map and game mode included in the Beta, explore how in-game progression works, and discover which rewards will carry over to the full launch. Whether you're aiming to dominate Multiplayer or survive the undead, our in-depth Beta guides cover all maps, modes, tips, and more to give you a competitive edge.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/o0/O0PI01KXDGUC1759357870746.jpg", "date": "2025-10-01T22:31:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "Midnight Expansion Information Wrapped Up", "url": "https://news.blizzard.com/en-us/article/24229031/midnight-expansion-information-wrapped-up", "summary": "Looking for more information about the Midnight expansion? Then we’ve got it all right here including more feature articles, the Deep Dive video, Q&A video, and more! We’ve wrapped it all up for you as we set the stage for the alpha test.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/7x/7XUOGEF59AEC1759274030813.png", "date": "2025-10-01T18:05:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Midnight Brings Journeys to Your Adventure", "url": "https://news.blizzard.com/en-us/article/24235746/midnight-brings-journeys-to-your-adventure", "summary": "Engage with World of Warcraft content in a meaningful way thanks to a brand-new feature tab in their Adventure Guide—Journeys—with a significant update to how you track your in-game progress, once Midnight launches.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/45/45U4HFCH0ZIA1759185000944.png", "date": "2025-10-01T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Take a Deep Dive into the New Demon Hunter Specialization, Devourer", "url": "https://news.blizzard.com/en-us/article/24235744/take-a-deep-dive-into-the-new-demon-hunter-specialization-devourer", "summary": "Learn more about the new damage-dealing spec for Demon Hunters, focused on delivering distinct gameplay mechanics depending on your specialization and Hero Talents using Void magic.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/gt/GTHSZ9VWDRWJ1759163716054.png", "date": "2025-10-01T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Developer Insight: Combat for Everyone in Midnight", "url": "https://news.blizzard.com/en-us/article/24235745/developer-insight-combat-for-everyone-in-midnight", "summary": "World of Warcraft: Midnight is on the horizon and set to streamline the game for players of all skill levels, giving WoW a more approachable combat system for all. Class specializations are being revamped to make it easier to track key buffs and debuffs, reduce pressure to rely on addons, and make the path to mastering every specialization clearer. Midnight keeps the excitement of combat alive while opening the door to WoW wider for everyone!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/4s/4SXW8DW6GO9Z1758931700410.png", "date": "2025-10-01T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Join Arator for a New Journey in Midnight", "url": "https://news.blizzard.com/en-us/article/24234071/join-arator-for-a-new-journey-in-midnight", "summary": "One of the available paths through the Midnight campaign, players will undertake a new questline alongside Arator, son of Turalyon and Alleria Windrunner. At the request of Alonsus Faol, you’ll recruit Arator for this continent-spanning adventure to seek out relics of the Light used by priests and paladins at the Sunwell when their reserves run dry.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/7j/7JLXOU8JBS1Q1758845411704.png", "date": "2025-10-01T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Level Up Your Talents in Midnight", "url": "https://news.blizzard.com/en-us/article/24230699/level-up-your-talents-in-midnight", "summary": "With the release of Midnight, a new adventure path opens up, raising the level cap to ninety. Along with these additional levels, we’re expanding talent trees with exciting new abilities and introducing what we call Apex talents.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/k5/K5YEVPY3XEN51759175131300.png", "date": "2025-10-01T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Midnight: Stay Awhile and Listen in the Arcantina!", "url": "https://news.blizzard.com/en-us/article/24234072/midnight-stay-awhile-and-listen-in-the-arcantina", "summary": "A refuge to the road-weary and those seeking a respite from the trials and travails of the life of an adventurer, the Arcantina serves as a crossway for all kinds. It is a magical tavern at the crossroads of nowhere and everywhere catering to travelers and heroes from all walks of life. It’s here you’ll meet up with some familiar faces for stories and quests sending you back out into Azeroth once more.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/rl/RL1POGO2HZTO1758848527264.png", "date": "2025-10-01T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Midnight Housing: Rewarding Decor", "url": "https://news.blizzard.com/en-us/article/24234113/midnight-housing-rewarding-decor", "summary": "In Midnight, players can acquire decor in a variety of ways. Whether it’s from purchasing an item from a vendor, earning an achievement, crafting with a profession, or getting a reward from a quest; there’s a multitude of options opening the way for you to decorate your home. In this article, we provide more insights into how you can add to your collection and express your unique style.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/29/29DR577CIDHA1759172703073.png", "date": "2025-10-01T18:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Pre-Purchase the World of Warcraft: Midnight Collector's Edition", "url": "https://news.blizzard.com/en-us/article/24235743/pre-purchase-the-world-of-warcraft-midnight-collector-s-edition", "summary": "Adventure is calling you home as the Worldsoul Saga continues in World of Warcraft: Midnight, arriving in 2026.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt1b0083380d3d9e15/68dc6007b5da2d625e22495f/WoW_-_12.0_CE_Support_Design_BnetShop_Standard_Textless_1920x1080.png", "date": "2025-10-01T16:30:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Watch the Midnight Q&A", "url": "https://news.blizzard.com/en-us/article/24224214/watch-the-midnight-q-a", "summary": "Game Director Ion Hazzikostas, Associate Game Director Paul Kubit, and Design Director Maria Hamilton join Community Manager Randy Jordan to answer your biggest questions about World of Warcraft: Midnight.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/qr/QR903ZX7L2WN1759173062333.png", "date": "2025-10-01T16:20:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a5 the Atlas features three new Pinnacle Bosses which you face in order to uncover the secrets of Caeserius family. In this expansion we have also introduced the exclusive Watchers’ Wrath Armour Set which you can earn by completing challenges in the league. For this news post we’ve gathered pieces of concept art for three new Pinnacles and the Armour Set. Check them out!", "image": "images/poe-logo.png", "date": "2025-06-30T20:31:15Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Update on Server Issues, Compromised Accounts and Visual Flickering", "url": "https://www.pathofexile.com/forum/view-thread/3801391", "summary": "We'd like to provide an update on a few important things that have been happening in Path of Exile. Find out more in this news post.", "image": "images/poe-logo.png", "date": "2025-06-27T03:44:47Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}];

/* Config */
const PAGE_SIZE = 30;
const SIDE_HERO_COUNT = 2; 
let currentPage = 1;

/* helpers */
function toLocal(utc) {
  if (!utc) return "";
  try { const d = new Date(utc); return d.toLocaleString(); } catch(e) { return utc; }
}
function isLogoLike(url, srcName) {
  // Treat only explicit PoE logos as "logo-fit"; everything else fills
  if (!url) return false;
  const low = String(url).toLowerCase();
  if (low.includes("poe-logo") || low.includes("pathofexile")) return true;
  if (srcName && String(srcName).toLowerCase().includes("poe")) return true;
  return false;
}
function normalizeSource(raw){
  const s = (raw||"").toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
  if (!s) return "Other";
  if (s === "blizzard" || s === "battlenet" || s === "battlenetcom" || s === "battle" || s === "battlenetnews") return "Blizzard";
  if (s === "poe" || s === "pathofexile" || s === "pathof_exile") return "Path of Exile";
  if (s === "pokemongo" || s === "pokemon" || s === "pokemongolive" || s === "pokémon_go" || s === "pokemon_go") return "Pokémon GO";
  return (raw||"").replace(/\b\w/g, c => c.toUpperCase());
}
function categoryOf(a){
  const src = normalizeSource(a.source || "");
  if (src === "Blizzard" && a.subheading) return a.subheading; // split Blizzard by game
  return src || "Other";
}

/* init & filters */
function init() {
  buildFilterChips();
  document.getElementById("searchInput").addEventListener("input", () => { currentPage = 1; applyFilters(); });
  document.getElementById("sortSelect").addEventListener("change", () => { currentPage = 1; applyFilters(); });
  document.getElementById("loadMore").addEventListener("click", () => {
    currentPage += 1;
    renderGrid(getFilteredArticles());
  });
  applyFilters();
  startAutoplay();
}
function buildFilterChips() {
  const container = document.getElementById("filters");
  const cats = Array.from(new Set(ARTICLES.map(categoryOf))).sort();
  const state = buildFilterChips.state || (buildFilterChips.state = { selected: new Set(cats) });

  container.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (state.selected.has(c) ? " active" : "");
    b.textContent = c;
    b.dataset.val = c;
    b.addEventListener("click", () => {
      b.classList.toggle("active");
      if (state.selected.has(c)) state.selected.delete(c); else state.selected.add(c);
      currentPage = 1;
      applyFilters();
    });
    container.appendChild(b);
  });
}
function getSelectedFilters() { const s = buildFilterChips.state?.selected; return s ? Array.from(s) : []; }
function getFilteredArticles() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const selected = getSelectedFilters();
  let filtered = ARTICLES.filter(a => {
    if (!a || !a.url) return false;
    const cat = categoryOf(a);
    if (selected.length && !selected.includes(cat)) return false;
    if (q) {
      const hay = ((a.title||"") + " " + (a.summary||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const sort = document.getElementById("sortSelect").value;
  if (sort === "new") filtered.sort((x,y)=> new Date(y.date||0) - new Date(x.date||0));
  else if (sort === "old") filtered.sort((x,y)=> new Date(x.date||0) - new Date(y.date||0));
  else if (sort === "az") filtered.sort((x,y)=> (x.title||"").localeCompare(y.title||""));
  else if (sort === "za") filtered.sort((x,y)=> (y.title||"").localeCompare(x.title||""));
  if (filtered.length && renderMainHeroAndSide.stateIdx >= filtered.length) renderMainHeroAndSide.stateIdx = 0;
  return filtered;
}

/* hero (main + side X) */
function renderMainHeroAndSide(filtered) {
  const mainEl = document.getElementById("mainHero");
  const sideGrid = document.getElementById("sideGrid");
  mainEl.innerHTML = "";
  sideGrid.innerHTML = "";
  if (!filtered.length) return;

  const n = filtered.length;
  const idx = renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) % n + n) % n;

  const mainArticle = filtered[idx];

  // Main hero image & overlay
  const mImg = document.createElement("img");
  mImg.alt = mainArticle.title || "";
  mImg.src = mainArticle.image || "";
  if (isLogoLike(mainArticle.image, mainArticle.source)) mImg.classList.add("logo-fit");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const mTitle = document.createElement("div");
  mTitle.className = "title clamp-2";
  mTitle.innerText = mainArticle.title || "(no title)";
  const mMeta = document.createElement("div");
  mMeta.className = "meta clamp-1";
  mMeta.innerText = (mainArticle.subheading || normalizeSource(mainArticle.source) || "") + " • " + toLocal(mainArticle.date);
  const mSumm = document.createElement("div");
  mSumm.className = "summary clamp-3";
  mSumm.innerText = mainArticle.summary || "";
  overlay.appendChild(mTitle);
  overlay.appendChild(mMeta);
  overlay.appendChild(mSumm);
  mainEl.appendChild(mImg);
  mainEl.appendChild(overlay);
  mainEl.onclick = () => { window.open(mainArticle.url, "_blank"); };

  // Prev/Next buttons
  const prev = document.createElement("button");
  prev.className = "hero-nav hero-prev";
  prev.setAttribute("aria-label","Previous featured article");
  prev.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  prev.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(-1); });
  const next = document.createElement("button");
  next.className = "hero-nav hero-next";
  next.setAttribute("aria-label","Next featured article");
  next.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  next.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(1); });
  mainEl.appendChild(prev);
  mainEl.appendChild(next);

  // Side heroes (count configurable)
  const sideCount = Math.min(SIDE_HERO_COUNT, n - 1);
  for (let i=1;i<=sideCount;i++){
    const a = filtered[(idx + i) % n];

    const card = document.createElement("div");
    card.className = "side-hero";

    const media = document.createElement("div");
    media.className = "side-hero-media";
    const img = document.createElement("img");
    img.alt = a.title || "";
    img.src = a.image || "";
    if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
    media.appendChild(img);

    const body = document.createElement("div");
    body.className = "side-hero-body";

    const title = document.createElement("div");
    title.className = "side-hero-title clamp-2";
    title.innerText = a.title || "(no title)";

    const summ = document.createElement("div");
    summ.className = "side-hero-summary clamp-3 fade-tail";
    summ.innerText = a.summary || "";

    const meta = document.createElement("div");
    meta.className = "side-hero-meta clamp-1";
    meta.innerText = (a.subheading || normalizeSource(a.source) || "") + " • " + toLocal(a.date);

    body.appendChild(title);
    body.appendChild(summ);
    body.appendChild(meta);

    card.appendChild(media);
    card.appendChild(body);
    card.onclick = () => { window.open(a.url, "_blank"); };

    sideGrid.appendChild(card);
  }
}

/* grid rendering with pagination */
function makeCard(a) {
  const card = document.createElement("article");
  card.className = "card";
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const img = document.createElement("img");
  img.alt = a.title || "";
  img.src = a.image || "";
  if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
  thumb.appendChild(img);

  const body = document.createElement("div");
  body.className = "card-body";
  const meta = document.createElement("div");
  meta.className = "card-meta";
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = ((normalizeSource(a.source) === "Blizzard") && a.subheading) ? a.subheading : normalizeSource(a.source);
  meta.appendChild(tag);
  const dt = document.createElement("div");
  dt.className = "badge";
  dt.textContent = toLocal(a.date);
  meta.appendChild(dt);

  const title = document.createElement("a");
  title.className = "card-title clamp-2";
  title.href = a.url;
  title.target = "_blank";
  title.rel = "noopener noreferrer";
  title.innerText = a.title || "(no title)";

  const summ = document.createElement("div");
  summ.className = "card-summary clamp-3";
  summ.innerText = a.summary || "";

  body.appendChild(meta);
  body.appendChild(title);
  body.appendChild(summ);

  card.appendChild(thumb);
  card.appendChild(body);

  card.addEventListener("click", () => { window.open(a.url, "_blank"); });

  return card;
}

function renderGrid(filtered){
  const grid = document.getElementById("feedGrid");
  const pager = document.getElementById("pager");
  grid.innerHTML = "";

  if (!filtered.length){
    document.getElementById("empty").style.display = "block";
    pager.style.display = "none";
    return;
  } else {
    document.getElementById("empty").style.display = "none";
  }

  const total = filtered.length;
  const showing = Math.min(total, currentPage * PAGE_SIZE);
  for (let i = 0; i < showing; i++){
    grid.appendChild(makeCard(filtered[i]));
  }

  // Pager visibility
  if (showing < total){
    pager.style.display = "flex";
  } else {
    pager.style.display = "none";
  }
}

/* filtering + autoplay */
function applyFilters() {
  const filtered = getFilteredArticles();
  renderMainHeroAndSide(filtered);
  renderGrid(filtered);
}
function startAutoplay(){ stopAutoplay(); startAutoplay.timer = setInterval(()=>{ shiftHero(1); }, 6000); }
function stopAutoplay(){ if (startAutoplay.timer){ clearInterval(startAutoplay.timer); startAutoplay.timer = null; } }
function shiftHero(delta){
  const filtered = getFilteredArticles();
  if (!filtered.length) return;
  renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) + delta + filtered.length) % filtered.length;
  renderMainHeroAndSide(filtered);
}

init();
</script>
