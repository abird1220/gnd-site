<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GameFeed — Dev News</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#021025;
  --card:#0b1320;
  --muted:#9aa6b2;
  --accent:#60a5fa;
  --accent-2:#38bdf8;
  --radius:10px;
  --image-focal-y: 12%; /* how far down from the top to center the crop (0% = very top) */

  /* Your tuned ratios — tweak here */
  --main-hero-height: 532px;
  --side-hero-width: 360px;

  /* Side hero sizing */
  --side-hero-row-h: 260px;
  --side-hero-media-h: 130px;
}

/* Base */
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;background:linear-gradient(180deg,#021025,#071225 60%);color:#eaf0fb}
.container{max-width:1200px;margin:24px auto;padding:0 18px}

/* Header & controls */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:8px;background:var(--accent);color:#03213a;display:flex;align-items:center;justify-content:center;font-weight:700}
.title{font-size:18px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.top-controls{display:flex;gap:12px;align-items:center}
.search{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:8px}
.search input{background:transparent;border:0;outline:none;color:inherit;width:220px;font-size:14px}
.select{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:8px;color:var(--muted)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 8px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.active{background:rgba(96,165,250,0.08);color:var(--accent);border-color:rgba(96,165,250,0.14)}

/* Section titles */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.section-title{font-weight:800;font-size:20px;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.section-sub{color:var(--muted);font-size:12px}

/* Layout */
.layout{display:flex;gap:16px;margin-top:8px}

/* Clamp */
.clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ===== MAIN HERO ===== */
.main-hero{
  position:relative; flex:1; height:var(--main-hero-height);
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04); cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.main-hero:hover{transform:translateY(-8px);box-shadow:0 28px 56px rgba(2,6,23,0.7)}
.main-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.main-hero img.logo-fit{object-fit:contain; padding:0}
.main-hero .overlay{
  position:absolute; left:0; right:0; bottom:0; padding:16px;
  background:linear-gradient(180deg, rgba(2,16,37,0) 0%, rgba(2,16,37,0.6) 35%, rgba(2,16,37,0.9) 100%);
}
.main-hero .title{font-size:22px;font-weight:800;margin:0 0 6px 0}
.main-hero .meta{color:#c5d2e0;font-size:13px;margin-bottom:6px}
.main-hero .summary{color:#eaf0fb;font-size:14px}

/* Hero arrows */
.hero-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:999px;
  background:rgba(9,16,29,0.55); border:1px solid rgba(255,255,255,0.2);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(4px);
  cursor:pointer; user-select:none;
  transition:background .15s ease, transform .15s ease, opacity .15s ease;
  opacity:.88;
}
.hero-nav:hover{background:rgba(9,16,29,0.7); transform:translateY(-50%) scale(1.05)}
.hero-prev{left:12px}
.hero-next{right:12px}
.hero-nav svg{pointer-events:none}

/* ===== SIDE HEROES ===== */
.side-wrap{width:var(--side-hero-width);display:flex;flex-direction:column;gap:10px}
.side-grid{display:grid;gap:12px;grid-auto-rows: var(--side-hero-row-h)}
.side-hero{
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04);
  cursor:pointer; transition:transform .18s ease,box-shadow .18s ease;
  display:flex; flex-direction:column; min-height:0;
}
.side-hero:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(2,6,23,0.5)}
.side-hero-media{position:relative; flex:0 0 var(--side-hero-media-h); background:#061025}
.side-hero-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% var(--image-focal-y); display:block}
.side-hero-media img.logo-fit{object-fit:contain; padding:0}
.side-hero-body{flex:1 1 auto; min-height:0; overflow:hidden; padding:10px; display:flex; flex-direction:column; gap:6px}
.side-hero-title{font-size:16px;font-weight:800;margin:0;line-height:1.2}
.side-hero-summary{color:#eaf0fb;font-size:13px;line-height:1.35}
.side-hero-meta{color:#c5d2e0;font-size:12px; margin-top:auto}

/* Fade tail for clamped summary */
.fade-tail{
  mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}

/* Grid cards */
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.02);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(2,6,23,0.6)}
.thumb{width:100%;height:0;padding-bottom:56.25%;position:relative;background:#061025}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.logo-fit{object-fit:contain;padding:0}
.card-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.card-title{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.tag{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.card-summary{color:#dfe9f5;font-size:14px;line-height:1.3}

/* Pager */
.pager{display:flex;justify-content:center;margin:22px 0}
.btn{
  padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.02);color:#eaf0fb;font-size:14px;cursor:pointer;
}
.btn:hover{background:rgba(255,255,255,0.06)}

/* responsive */
@media(max-width:900px){
  .layout{flex-direction:column}
  .side-wrap{width:100% !important}
  .side-grid{grid-auto-rows: 260px}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">
      <div class="logo">GF</div>
      <div>
        <div class="title">GameFeed</div>
        <div class="subtitle">Direct from devs — Blizzard • Pokémon GO • Path of Exile</div>
      </div>
    </div>

    <div class="top-controls">
      <div class="search" title="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35" stroke="#9aa6b2" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Search title or summary..." aria-label="Search articles" />
      </div>

      <select id="sortSelect" class="select" title="Sort">
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Filter</div>
      <div id="filters" class="filters"></div>
    </div>
    <div style="text-align:right;color:var(--muted)"></div>
  </div>

  <div class="section-head">
    <div class="section-title">Featured Headlines</div>
    <div class="section-sub">Auto-rotating through top stories</div>
  </div>

  <main class="layout" role="main" aria-label="News hero and feed">
    <section class="main-hero" id="mainHero" tabindex="0" aria-label="Featured main article"></section>

    <section class="side-wrap" aria-label="Featured">
      <div class="side-grid" id="sideGrid" aria-live="polite"></div>
    </section>
  </main>

  <div class="section-title" style="margin-top:22px">Latest News</div>

  <section class="grid" id="feedGrid" aria-live="polite" aria-label="All news articles"></section>

  <div id="empty" style="display:none;text-align:center;color:var(--muted);padding:40px">No articles match your filters.</div>

  <div class="pager" id="pager" style="display:none">
    <button id="loadMore" class="btn" aria-label="Load more articles">Load more</button>
  </div>

  <div class="footer" style="display:none">Built with ❤️ — uses news.json</div>
</div>

<script>
const ARTICLES = [{"title": "A message from TeamRICOCHET", "url": "https://news.blizzard.com/en-us/article/24223315/a-message-from-teamricochet", "summary": "Over the last year, our team has been laying the groundwork to bring Call of Duty players on a new journey toward the most robust anti-cheat protections in gaming. That starts with the Black Ops 7 PC Beta.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/OI30CVX3V4LY1634334001788.jpg", "date": "2025-09-24T17:00:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "A New Tale: “Crimson Mass”", "url": "https://news.blizzard.com/en-us/article/24226736/a-new-tale-crimson-mass", "summary": "Gather round to read the prequel to the Flesh Harvest quest, releasing with the next Diablo Immortal major update on September 25.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt894933a0ad46f81f/68d1c105517279f9bfa01684/DIV_RedMass_1920x1080_1_NoText.jpg", "date": "2025-09-24T16:37:59Z", "subheading": "Diablo Immortal", "game": "Diablo Immortal", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt989ffb415ea874fa/6081aad335bb4d0cbd9c064b/D_Immortal_Icon.svg", "source": "blizzard"}, {"title": "Save Up to 33% on Select WoW Classic Progression Game Services", "url": "https://news.blizzard.com/en-us/article/24235739/save-up-to-33-on-select-wow-classic-progression-game-services", "summary": "Dive into daring adventures on World of Warcraft® Classic Progression realms (currently Mists of Pandaria™ Classic) by making the most out of up to 33% off select game services through October 15.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ct/CTTUIBCN72ZX1758238552444.png", "date": "2025-09-23T18:34:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Mists of Pandaria Classic: Landfall Content Update is Now Live", "url": "https://news.blizzard.com/en-us/article/24229242/mists-of-pandaria-classic-landfall-content-update-is-now-live", "summary": "The first major content update for Mists of Pandaria Classic, Landfall, is now live. Join the Horde or Alliance on the shores of Krasarang Wilds, seek out Wrathion to pursue Legendary items, join the Brawler's Guild for challenging fights for prestige, and explore even more exciting content!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/o1/O1F9XFK4DFLL1756506680353.png", "date": "2025-09-23T17:57:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Make Sure to Don Your Kilts, Brewfest is Here!", "url": "https://news.blizzard.com/en-us/article/24235740/make-sure-to-don-your-kilts-brewfest-is-here", "summary": "Eat delicious food, drink bountiful beverages, ride rams around barrels of apples, and earn stout rewards! Brewfest has arrived, and you can enjoy all that and more from September 23 to October 9.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/m9/M9SF8JC1PQ791758324445617.png", "date": "2025-09-23T14:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Reap the Flesh Harvest", "url": "https://news.blizzard.com/en-us/article/24226326/reap-the-flesh-harvest", "summary": "Discover the rot teeming within the Sharval Wilds, an all-new main quest, and more.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt5e04240dfbb3d579/68d2c57de6f87a942627a730/Q3_event_C_final_1920x1080.jpg", "date": "2025-09-23T13:00:00Z", "subheading": "Diablo Immortal", "game": "Diablo Immortal", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt989ffb415ea874fa/6081aad335bb4d0cbd9c064b/D_Immortal_Icon.svg", "source": "blizzard"}, {"title": "Black Ops 7 Multiplayer Deep Dive", "url": "https://news.blizzard.com/en-us/article/24228405/black-ops-7-multiplayer-deep-dive", "summary": "Gain complete tactical knowledge on everything related to Black Ops 7 Multiplayer, including intel on modes, maps, weapons, Perks, Field Upgrades, the new Overclock system, Hybrid Combat Specialties, Wildcards, Scorestreaks, Prestige, and Progression systems and much more. Get intel on what’s on deck for the Beta starting on October 2!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/qh/QH0663QMNTSS1758565842011.jpg", "date": "2025-09-22T18:30:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "StarCraft II 5.0.15 PTR Update", "url": "https://news.blizzard.com/en-us/article/24227052/starcraft-ii-5-0-15-ptr-update", "summary": "We've added new and modified changes on PTR today. Check out the details here.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ga/GAJZKEC09RPX1554829654442.jpg", "date": "2025-09-22T17:00:00Z", "subheading": "StarCraft II", "game": "StarCraft II", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt9651ec7eb6d443ff/5d48a3880927f67fc0547065/starcraft-ii.svg", "source": "blizzard"}, {"title": "Back to School! Inside Blizzard’s Internship Program – Part 1", "url": "https://news.blizzard.com/en-us/article/24230695/back-to-school-inside-blizzards-internship-program-part-1", "summary": "Hear from two recruiters who are looking to hire next year’s intern class.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/5d/5D0TH08KXAUM1757116961494.jpg", "date": "2025-09-19T17:00:00Z", "subheading": "Blizzard", "game": "Blizzard", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/bltbd6b3637d77c60f0/5da8a74e9147457fdde5f6d3/blizzard.svg", "source": "blizzard"}, {"title": "WoW Weekly: Legion Remix, Naxxramas Looms in WoW Classic Anniversary Edition, and More!", "url": "https://news.blizzard.com/en-us/article/24229248/wow-weekly-legion-remix-naxxramas-looms-in-wow-classic-anniversary-edition-and-more", "summary": "Adventure, loot, and style await—dive into game-changing updates, epic raids, legendary gear, and eye-catching transmog sets! Every week brings thrilling new adventures and loot, so rally your allies and forge your legend in Azeroth.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/zv/ZV27Y5YA6SIS1758297014952.png", "date": "2025-09-19T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Weekly Recall: Written in the Stars", "url": "https://news.blizzard.com/en-us/article/24225819/weekly-recall-written-in-the-stars", "summary": "Can’t decide which Hero to pick up next? Kick off spooky season by letting the universe (and the Community team) assign you a new main based on your zodiac sign.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/0r/0RWOL7COG8KN1758242172879.png", "date": "2025-09-19T16:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "Ready Your Appetite for the Flesh Harvest", "url": "https://news.blizzard.com/en-us/article/24226325/ready-your-appetite-for-the-flesh-harvest", "summary": "Preview the Flesh Harvest major update, featuring a new Main Quest, full release of the Sharval Wilds Zone, and more.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt88c79d8cf3dcfc99/68cc2a19a475c61fd807e171/DF1020_1920x1080.jpg", "date": "2025-09-19T13:00:00Z", "subheading": "Diablo Immortal", "game": "Diablo Immortal", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt989ffb415ea874fa/6081aad335bb4d0cbd9c064b/D_Immortal_Icon.svg", "source": "blizzard"}, {"title": "WoW Classic Anniversary Edition: Naxxramas Casts its Shadow October 2", "url": "https://news.blizzard.com/en-us/article/24229247/wow-classic-anniversary-edition-naxxramas-casts-its-shadow-october-2", "summary": "Horrors of the past and new terrors yet to be unleashed are gathering inside the necropolis. Face the massive attack upon Azeroth as the Lich King's servants prepare their assault. The Scourge marches again—engage in battles within floating necropolises, destroy necrotic shards, and fend off waves of undead mobs, while completing quests and earning loot.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/63/63KJ6LF3263V1758137690775.jpg", "date": "2025-09-18T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "StarCraft II 5.0.15 PTR Patch Notes", "url": "https://news.blizzard.com/en-us/article/24225582/starcraft-ii-5-0-15-ptr-patch-notes", "summary": "We are excited to push Patch 5.0.15 to PTR which features various balance changes and bug fixes.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ga/GAJZKEC09RPX1554829654442.jpg", "date": "2025-09-18T16:40:00Z", "subheading": "StarCraft II", "game": "StarCraft II", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt9651ec7eb6d443ff/5d48a3880927f67fc0547065/starcraft-ii.svg", "source": "blizzard"}, {"title": "Legion Remix and the 11.2.5 Content Update Goes Live October 7!", "url": "https://news.blizzard.com/en-us/article/24225601/legion-remix-and-the-11-2-5-content-update-goes-live-october-7", "summary": "Get ready for fast frenetic fun in Legion Remix as you meet up with the infinite dragonflight once more, level new characters, and earn a variety of items to add to your collection. Additional updates are ahead in the 11.2.5 Content Update including the return of Turbo-Boost and additional updates to the Cooldown Manager.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/3j/3JQRF6O802AQ1757956517086.png", "date": "2025-09-17T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "33.4.2 Patch Notes", "url": "https://news.blizzard.com/en-us/article/24223779/33-4-2-patch-notes", "summary": "Check out the latest updates for Hearthstone and Battlegrounds, along with a few bug fixes.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blte4d01dd255c95e24/68c9e27fa475c6aeaf07e163/image_(11).png", "date": "2025-09-17T15:50:00Z", "subheading": "Hearthstone", "game": "Hearthstone", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt05905fb295358316/5d48a37efbf0e17fc6dafd3c/hearthstone.svg", "source": "blizzard"}, {"title": "Diablo IV Patch Notes", "url": "https://news.blizzard.com/en-us/article/24222917/diablo-iv-patch-notes", "summary": "We will continually update this article with all patches the development team implements for Diablo IV.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/l3/L3LPQKVMFYZL1723657973250.png", "date": "2025-09-16T18:44:05Z", "subheading": "Diablo IV", "game": "Diablo IV", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt95aebf4d119210f5/5e543f7e8dc1e51c53168b7a/games-d4-colored.svg", "source": "blizzard"}, {"title": "Rally Against Hell in Season of Infernal Chaos", "url": "https://news.blizzard.com/en-us/article/24226702/rally-against-hell-in-season-of-infernal-chaos", "summary": "Earn powerful Chaos Armor, wield fearsome Chaos Perks, and fight in a revamped Infernal Hordes in Season of Infernal Chaos.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt173fd74740970736/68c83e91e6f87add4c27a66c/DIA_DIV_S10_Key_Art_1920x1080_NoText.png", "date": "2025-09-16T17:00:00Z", "subheading": "Diablo IV", "game": "Diablo IV", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt95aebf4d119210f5/5e543f7e8dc1e51c53168b7a/games-d4-colored.svg", "source": "blizzard"}, {"title": "Elevate Your Style with the Ascended Regalia Pack", "url": "https://news.blizzard.com/en-us/article/24229244/elevate-your-style-with-the-ascended-regalia-pack", "summary": "Adorn yourself in serene blues and opulent purples with this dazzling (and massive) transmog collection, crafted to let your ascended spirit soar. Swap and combine over one hundred interchangeable transmog pieces, including twenty-two stunning weapon appearances, to compose a style that's entirely your own. Step into the light—because enlightenment has never looked this bold.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/fd/FDVCD9D9FNBC1757530322887.png", "date": "2025-09-16T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Black Ops 7: Vault Edition Operators Update", "url": "https://news.blizzard.com/en-us/article/24230697/black-ops-7-vault-edition-operators-update", "summary": "In the spirit of addressing some recent feedback, here’s an updated look at the Vault Edition Operators, and confirmation regarding multiple Zombies Intel Blasts coming soon!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/lf/LFA4N3NST4MD1758040681877.jpg", "date": "2025-09-16T16:00:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "Black Ops 7 Zombies: Meet the Expanded Team", "url": "https://news.blizzard.com/en-us/article/24223665/black-ops-7-zombies-meet-the-expanded-team", "summary": "A battle atop the headquarters of Project Janus turns into a terrifying dimensional dive into the Dark Aether.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/4q/4Q7F5CPR14ZR1758041054289.jpg", "date": "2025-09-16T16:00:00Z", "subheading": "Call of Duty", "game": "Call of Duty", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt317f15ba7969c454/64c9a67920099ccbc19b2f1f/callofduty.svg", "source": "blizzard"}, {"title": "Keep the Flow Going in Season 18 Midcycle", "url": "https://news.blizzard.com/en-us/article/24234069/keep-the-flow-going-in-season-18-midcycle", "summary": "Overwatch 2 brings Tracer to Stadium, celebrates Anniversary 2025, and stacks loot with nonstop style in the midseason update!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ur/URV6N7LG30AY1758038949052.png", "date": "2025-09-16T16:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "The Hearthstone International Showmatch Is Coming!", "url": "https://news.blizzard.com/en-us/article/24226734/the-hearthstone-international-showmatch-is-coming", "summary": "Check out all the details on the upcoming Showmatch pitting two international teams against each other!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/y3/Y3KLMK8GE3XR1757714777485.png", "date": "2025-09-16T15:00:00Z", "subheading": "Hearthstone", "game": "Hearthstone", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt05905fb295358316/5d48a37efbf0e17fc6dafd3c/hearthstone.svg", "source": "blizzard"}, {"title": "Weekly Recall: Blinkity-Blinkity, Tracer’s in Stadium!", "url": "https://news.blizzard.com/en-us/article/24230696/weekly-recall-blinkity-blinkity-tracers-in-stadium", "summary": "Importing Heroes into Stadium is more than just copy and paste. Senior systems designer Conor Kou explains the process of bringing Heroes like Tracer into Stadium with wilder kits and more customization.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/su/SUBTWELZNAWO1757626785094.png", "date": "2025-09-15T18:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "Weekend Stash Tab Sale", "url": "https://www.pathofexile.com/forum/view-thread/3851449", "summary": "This weekend we’re running a Stash Tab Sale! You can view the full selection of discounted tabs <a href=\"https://pathofexile2.com/shop/all?filter=special\">here</a>. \n<a href=\"https://www.pathofexile.com/forum/view-thread/3851449\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-09-12T00:10:19Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Path of Exile 3.27 Expansion Timeline", "url": "https://www.pathofexile.com/forum/view-thread/3850458", "summary": "It’s been three months since the launch of Mercenaries of Trarthus, so it’s time to talk about what’s next for Path of Exile 1. In this news post, we'd like to give you a small update regarding the timeline for the 3.27 expansion.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3850458\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-09-10T21:49:55Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Merciless Gauntlet Statistics", "url": "https://www.pathofexile.com/forum/view-thread/3824611", "summary": "The Merciless Gauntlet has concluded, congratulations to Ben_ for taking the top spot! It was a <strong>bla</strong>st watching the action, so we've prepared some statistics from the event in today's news post. Check them out!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3824611\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-08-11T21:20:34Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Past Mystery Box Microtransactions Weekend Sale", "url": "https://www.pathofexile.com/forum/view-thread/3823609", "summary": "This weekend, all cosmetic effects from the Sentinel, Kalandra, Sanctum, Crucible, Ancestor, Affliction and Necropolis Mystery Boxes as well as their variations are going on sale, so you can grab them at a discounted price! \n<a href=\"https://www.pathofexile.com/forum/view-thread/3823609\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-08-08T04:49:38Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Fan Art Competition Runners Up", "url": "https://www.pathofexile.com/forum/view-thread/3823025", "summary": "Earlier this week we announced the winners of our <a href=\"https://www.pathofexile.com/forum/view-thread/3822457\">Secrets of the Atlas Fan Art Competition Winners</a>! Today, we'd like to announce and highlight more runners-up. Check them out!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3823025\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-08-07T00:50:21Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Fan Art Competition Winners", "url": "https://www.pathofexile.com/forum/view-thread/3822457", "summary": "Our Secrets of the Atlas themed Fan Art Competition concluded last week. More than 150 Exiles submitted their art inspired by our latest Path of Exile expansion and its content. With the help of our art team, we’ve selected the winners and are now ready to announce them!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3822457\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-08-04T22:28:23Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Merciless Gauntlet Highlights", "url": "https://www.pathofexile.com/forum/view-thread/3822202", "summary": "The Merciless Gauntlet started last week, and the top competitors are displaying unbelievable levels of skill. Zizaran and his team have put together a highlight reel of the event so far, which you can check out in today's news post.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3822202\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-08-04T01:57:12Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Weekend Stash Tab Sale & Free Mystery Box When You Spend Points", "url": "https://www.pathofexile.com/forum/view-thread/3821270", "summary": "This weekend we’re running a Stash Tab Sale and offering a free Mystery Box when you spend points! You can view the full selection of discounted tabs <a href=\"https://www.pathofexile.com/shop/category/specials\">here</a>. Some of these tabs will work in both Path of Exile 1 and 2. Find out more in today's news post.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3821270\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-08-01T00:17:05Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Zizaran’s Class Gauntlet Available on Consoles", "url": "https://www.pathofexile.com/forum/view-thread/3820508", "summary": "We’re once again partnering with Zizaran for another 10-day Class Gauntlet event which will start on July 31st PDT. For the first time ever, this event will also be available on consoles in a limited capacity. Check out the details in this news post.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3820508\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-29T23:45:43Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Fan Art Competition Highlights", "url": "https://www.pathofexile.com/forum/view-thread/3820461", "summary": "Our Secrets of the Atlas Fan Art Competition, where our community creates Fan Art inspired by content introduced in the Secrets of the Atlas expansion for prizes, is ending soon. Check out some of the submissions in today’s news post!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3820461\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-29T21:57:44Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Second Boss Kill Event Winners", "url": "https://www.pathofexile.com/forum/view-thread/3820128", "summary": "All of the prizes for the rerun of the Secrets of the Atlas Boss Kill Event have now been claimed for PC and Consoles. Congratulations to all of the winners! Find out more in this news post! \n<a href=\"https://www.pathofexile.com/forum/view-thread/3820128\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-28T23:06:49Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Character, Portal, and Footprint Effects Weekend Sale", "url": "https://www.pathofexile.com/forum/view-thread/3818517", "summary": "We have a huge sale on Character, Portal and Footprint Effects this weekend! Take advantage of this opportunity to add the finishing touches to any stylised setup. Check out the full selection of discounted cosmetics <a href=\"https://www.pathofexile.com/shop/category/specials\">here</a>.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3818517\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-25T03:28:00Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Developer Interviews - Zaccie, Game Designer", "url": "https://www.pathofexile.com/forum/view-thread/3818489", "summary": "In this episode of our Developer Interviews series, Eben talked to Zaccie, a Game Designer at Grinding Gear Games whose work focuses on monster balance. Check out the interview in today's news post!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3818489\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-25T01:39:45Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Fan Art Competition Highlights", "url": "https://www.pathofexile.com/forum/view-thread/3817940", "summary": "Another week has flown by and entries for our Secrets of the Atlas Fan Art Competition are flying in! The amazing artists from our community are creating pieces inspired by the Secrets of the Atlas expansion for prizes! Check out some highlights in today’s news post. \n<a href=\"https://www.pathofexile.com/forum/view-thread/3817940\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-23T21:30:30Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Patch 3.26.0e Preview", "url": "https://www.pathofexile.com/forum/view-thread/3817432", "summary": "We'll soon be releasing Patch 3.26.0e for Path of Exile, which contains a handful of improvements, including adjusting the location of the Recombinator in Kingsmarch, and numerous bugfixes. Check out a preview of the patch notes in today's news post!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3817432\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-22T21:26:03Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Zizaran’s Class Gauntlet Event Starts on July 31st", "url": "https://www.pathofexile.com/forum/view-thread/3816964", "summary": "We’re once again partnering with Zizaran for another 10-day Class Gauntlet event which will start on July 31st PDT. Racers will need to endure some of the most challenging conditions Wraeclast can throw at them in order to survive the Merciless Gauntlet! \n<a href=\"https://www.pathofexile.com/forum/view-thread/3816964\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-21T22:22:14Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Hideout Showcase and Hideout Sale", "url": "https://www.pathofexile.com/forum/view-thread/3815000", "summary": "The horde of hideout homesteaders have handcrafted a heap of new hearty havens in Path of Exile 1! To aid aspiring architects, hideouts and decorations are on sale this weekend. Check out today's news post to find out more.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3815000\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-18T02:00:00Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Second Boss Kill Event", "url": "https://www.pathofexile.com/forum/view-thread/3814482", "summary": "Next Thursday, July 24th PDT, we’ll be hosting a second Boss Kill Event in Path of Exile where players can compete to kill the new Pinnacle Bosses from the Secrets of the Atlas expansion. The event will be available to our console players as well. The prize pool includes Godslayer’s Pride microtransactions and the opportunity to collaborate with our devs to create new Unique Items and Divination Cards. Find out more in this news post!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3814482\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-17T01:16:08Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Build Showcase", "url": "https://www.pathofexile.com/forum/view-thread/3813889", "summary": "It's already been one month since the launch of Secrets of the Atlas and there are some pretty neat builds popping up! While these builds may not shake up the meta, they certainly showcase a lot of creativity or in some cases take us down memory lane and revisit old favourites!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3813889\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-15T23:40:50Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Concept Art - Supporter Packs", "url": "https://www.pathofexile.com/forum/view-thread/3813286", "summary": "The launch of Secrets of the Atlas introduced two new series of supporter packs; the Cryptkeeper series and the Phrecian Magistrate series. Check out some of the concept art for these packs in today's news post. \n<a href=\"https://www.pathofexile.com/forum/view-thread/3813286\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-14T21:25:56Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Fan Art Competition Highlights", "url": "https://www.pathofexile.com/forum/view-thread/3812810", "summary": "Last week, we launched a Fan Art Competition themed around the Secrets of the Atlas expansion. We've gathered up some highlights from the submissions so far. Check them out in today's news post!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3812810\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-13T22:10:15Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Fan Art Competition", "url": "https://www.pathofexile.com/forum/view-thread/3808679", "summary": "It’s been a while since we’ve had a fan art competition for community artists, so we’re very excited to bring it back! We're launching a fan art competition themed around the Secrets of the Atlas expansion and everything introduced in it. The prize pool includes Path of Exile merchandise and in-game microtransactions. Find out more in this news post.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3808679\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-06T21:57:26Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Phishing Emails Warning", "url": "https://www.pathofexile.com/forum/view-thread/3806585", "summary": "Some players have recently reported that they're receiving phishing emails impersonating our Support team members. We would like to remind everyone to carefully check that the email address you are receiving emails from is support@grindinggear.com before replying, and to never click on any suspicious links without checking the link's location. \n<a href=\"https://www.pathofexile.com/forum/view-thread/3806585\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-07-03T23:50:04Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Development  {"title": "Update on Server Issues, Compromised Accounts and Visual Flickering", "url": "https://www.pathofexile.com/forum/view-thread/3801391", "summary": "We'd like to provide an update on a few important things that have been happening in Path of Exile. Find out more in this news post.\n<a href=\"https://www.pathofexile.com/forum/view-thread/3801391\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-06-27T03:44:47Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Secrets of the Atlas Original Soundtrack", "url": "https://www.pathofexile.com/forum/view-thread/3800540", "summary": "No expansion is complete without a soundtrack to set the tone, and the score for Path of Exile: Secrets of the Atlas certainly doesn't neglect this. Check out the tracks for the Secrets of the Atlas Original Soundtrack by Kamil Orman-Janowski and Michael James Collier in today's news post!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3800540\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-06-25T22:46:15Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Boss Kill Event Winners", "url": "https://www.pathofexile.com/forum/view-thread/3799055", "summary": "The Secrets of the Atlas Boss Kill Event for PC has now concluded! The race for the top 10 was close, and all bonus boss kills have been claimed! Find out more in this news post!\n<a href=\"https://www.pathofexile.com/forum/view-thread/3799055\">Read More.</a>", "image": "images/poe-logo.png", "date": "2025-06-23T22:06:54Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}];

/* Config */
const PAGE_SIZE = 30;
const SIDE_HERO_COUNT = 2; 
let currentPage = 1;

/* helpers */
function toLocal(utc) {
  if (!utc) return "";
  try { const d = new Date(utc); return d.toLocaleString(); } catch(e) { return utc; }
}
function isLogoLike(url, srcName) {
  // Treat only explicit PoE logos as "logo-fit"; everything else fills
  if (!url) return false;
  const low = String(url).toLowerCase();
  if (low.includes("poe-logo") || low.includes("pathofexile")) return true;
  if (srcName && String(srcName).toLowerCase().includes("poe")) return true;
  return false;
}
function normalizeSource(raw){
  const s = (raw||"").toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
  if (!s) return "Other";
  if (s === "blizzard" || s === "battlenet" || s === "battlenetcom" || s === "battle" || s === "battlenetnews") return "Blizzard";
  if (s === "poe" || s === "pathofexile" || s === "pathof_exile") return "Path of Exile";
  if (s === "pokemongo" || s === "pokemon" || s === "pokemongolive" || s === "pokémon_go" || s === "pokemon_go") return "Pokémon GO";
  return (raw||"").replace(/\b\w/g, c => c.toUpperCase());
}
function categoryOf(a){
  const src = normalizeSource(a.source || "");
  if (src === "Blizzard" && a.subheading) return a.subheading; // split Blizzard by game
  return src || "Other";
}

/* init & filters */
function init() {
  buildFilterChips();
  document.getElementById("searchInput").addEventListener("input", () => { currentPage = 1; applyFilters(); });
  document.getElementById("sortSelect").addEventListener("change", () => { currentPage = 1; applyFilters(); });
  document.getElementById("loadMore").addEventListener("click", () => {
    currentPage += 1;
    renderGrid(getFilteredArticles());
  });
  applyFilters();
  startAutoplay();
}
function buildFilterChips() {
  const container = document.getElementById("filters");
  const cats = Array.from(new Set(ARTICLES.map(categoryOf))).sort();
  const state = buildFilterChips.state || (buildFilterChips.state = { selected: new Set(cats) });

  container.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (state.selected.has(c) ? " active" : "");
    b.textContent = c;
    b.dataset.val = c;
    b.addEventListener("click", () => {
      b.classList.toggle("active");
      if (state.selected.has(c)) state.selected.delete(c); else state.selected.add(c);
      currentPage = 1;
      applyFilters();
    });
    container.appendChild(b);
  });
}
function getSelectedFilters() { const s = buildFilterChips.state?.selected; return s ? Array.from(s) : []; }
function getFilteredArticles() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const selected = getSelectedFilters();
  let filtered = ARTICLES.filter(a => {
    if (!a || !a.url) return false;
    const cat = categoryOf(a);
    if (selected.length && !selected.includes(cat)) return false;
    if (q) {
      const hay = ((a.title||"") + " " + (a.summary||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const sort = document.getElementById("sortSelect").value;
  if (sort === "new") filtered.sort((x,y)=> new Date(y.date||0) - new Date(x.date||0));
  else if (sort === "old") filtered.sort((x,y)=> new Date(x.date||0) - new Date(y.date||0));
  else if (sort === "az") filtered.sort((x,y)=> (x.title||"").localeCompare(y.title||""));
  else if (sort === "za") filtered.sort((x,y)=> (y.title||"").localeCompare(x.title||""));
  if (filtered.length && renderMainHeroAndSide.stateIdx >= filtered.length) renderMainHeroAndSide.stateIdx = 0;
  return filtered;
}

/* hero (main + side X) */
function renderMainHeroAndSide(filtered) {
  const mainEl = document.getElementById("mainHero");
  const sideGrid = document.getElementById("sideGrid");
  mainEl.innerHTML = "";
  sideGrid.innerHTML = "";
  if (!filtered.length) return;

  const n = filtered.length;
  const idx = renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) % n + n) % n;

  const mainArticle = filtered[idx];

  // Main hero image & overlay
  const mImg = document.createElement("img");
  mImg.alt = mainArticle.title || "";
  mImg.src = mainArticle.image || "";
  if (isLogoLike(mainArticle.image, mainArticle.source)) mImg.classList.add("logo-fit");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const mTitle = document.createElement("div");
  mTitle.className = "title clamp-2";
  mTitle.innerText = mainArticle.title || "(no title)";
  const mMeta = document.createElement("div");
  mMeta.className = "meta clamp-1";
  mMeta.innerText = (mainArticle.subheading || normalizeSource(mainArticle.source) || "") + " • " + toLocal(mainArticle.date);
  const mSumm = document.createElement("div");
  mSumm.className = "summary clamp-3";
  mSumm.innerText = mainArticle.summary || "";
  overlay.appendChild(mTitle);
  overlay.appendChild(mMeta);
  overlay.appendChild(mSumm);
  mainEl.appendChild(mImg);
  mainEl.appendChild(overlay);
  mainEl.onclick = () => { window.open(mainArticle.url, "_blank"); };

  // Prev/Next buttons
  const prev = document.createElement("button");
  prev.className = "hero-nav hero-prev";
  prev.setAttribute("aria-label","Previous featured article");
  prev.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  prev.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(-1); });
  const next = document.createElement("button");
  next.className = "hero-nav hero-next";
  next.setAttribute("aria-label","Next featured article");
  next.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  next.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(1); });
  mainEl.appendChild(prev);
  mainEl.appendChild(next);

  // Side heroes (count configurable)
  const sideCount = Math.min(SIDE_HERO_COUNT, n - 1);
  for (let i=1;i<=sideCount;i++){
    const a = filtered[(idx + i) % n];

    const card = document.createElement("div");
    card.className = "side-hero";

    const media = document.createElement("div");
    media.className = "side-hero-media";
    const img = document.createElement("img");
    img.alt = a.title || "";
    img.src = a.image || "";
    if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
    media.appendChild(img);

    const body = document.createElement("div");
    body.className = "side-hero-body";

    const title = document.createElement("div");
    title.className = "side-hero-title clamp-2";
    title.innerText = a.title || "(no title)";

    const summ = document.createElement("div");
    summ.className = "side-hero-summary clamp-3 fade-tail";
    summ.innerText = a.summary || "";

    const meta = document.createElement("div");
    meta.className = "side-hero-meta clamp-1";
    meta.innerText = (a.subheading || normalizeSource(a.source) || "") + " • " + toLocal(a.date);

    body.appendChild(title);
    body.appendChild(summ);
    body.appendChild(meta);

    card.appendChild(media);
    card.appendChild(body);
    card.onclick = () => { window.open(a.url, "_blank"); };

    sideGrid.appendChild(card);
  }
}

/* grid rendering with pagination */
function makeCard(a) {
  const card = document.createElement("article");
  card.className = "card";
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const img = document.createElement("img");
  img.alt = a.title || "";
  img.src = a.image || "";
  if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
  thumb.appendChild(img);

  const body = document.createElement("div");
  body.className = "card-body";
  const meta = document.createElement("div");
  meta.className = "card-meta";
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = ((normalizeSource(a.source) === "Blizzard") && a.subheading) ? a.subheading : normalizeSource(a.source);
  meta.appendChild(tag);
  const dt = document.createElement("div");
  dt.className = "badge";
  dt.textContent = toLocal(a.date);
  meta.appendChild(dt);

  const title = document.createElement("a");
  title.className = "card-title clamp-2";
  title.href = a.url;
  title.target = "_blank";
  title.rel = "noopener noreferrer";
  title.innerText = a.title || "(no title)";

  const summ = document.createElement("div");
  summ.className = "card-summary clamp-3";
  summ.innerText = a.summary || "";

  body.appendChild(meta);
  body.appendChild(title);
  body.appendChild(summ);

  card.appendChild(thumb);
  card.appendChild(body);

  card.addEventListener("click", () => { window.open(a.url, "_blank"); });

  return card;
}

function renderGrid(filtered){
  const grid = document.getElementById("feedGrid");
  const pager = document.getElementById("pager");
  grid.innerHTML = "";

  if (!filtered.length){
    document.getElementById("empty").style.display = "block";
    pager.style.display = "none";
    return;
  } else {
    document.getElementById("empty").style.display = "none";
  }

  const total = filtered.length;
  const showing = Math.min(total, currentPage * PAGE_SIZE);
  for (let i = 0; i < showing; i++){
    grid.appendChild(makeCard(filtered[i]));
  }

  // Pager visibility
  if (showing < total){
    pager.style.display = "flex";
  } else {
    pager.style.display = "none";
  }
}

/* filtering + autoplay */
function applyFilters() {
  const filtered = getFilteredArticles();
  renderMainHeroAndSide(filtered);
  renderGrid(filtered);
}
function startAutoplay(){ stopAutoplay(); startAutoplay.timer = setInterval(()=>{ shiftHero(1); }, 6000); }
function stopAutoplay(){ if (startAutoplay.timer){ clearInterval(startAutoplay.timer); startAutoplay.timer = null; } }
function shiftHero(delta){
  const filtered = getFilteredArticles();
  if (!filtered.length) return;
  renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) + delta + filtered.length) % filtered.length;
  renderMainHeroAndSide(filtered);
}

init();
</script>
