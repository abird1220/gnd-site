<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GameFeed — Dev News</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#021025;
  --card:#0b1320;
  --muted:#9aa6b2;
  --accent:#60a5fa;
  --accent-2:#38bdf8;
  --radius:10px;
  --image-focal-y: 12%; /* how far down from the top to center the crop (0% = very top) */

  /* Your tuned ratios — tweak here */
  --main-hero-height: 532px;
  --side-hero-width: 360px;

  /* Side hero sizing */
  --side-hero-row-h: 260px;
  --side-hero-media-h: 130px;
}

/* Base */
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;background:linear-gradient(180deg,#021025,#071225 60%);color:#eaf0fb}
.container{max-width:1200px;margin:24px auto;padding:0 18px}

/* Header & controls */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:8px;background:var(--accent);color:#03213a;display:flex;align-items:center;justify-content:center;font-weight:700}
.title{font-size:18px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.top-controls{display:flex;gap:12px;align-items:center}
.search{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:8px}
.search input{background:transparent;border:0;outline:none;color:inherit;width:220px;font-size:14px}
.select{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:8px;color:var(--muted)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 8px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.active{background:rgba(96,165,250,0.08);color:var(--accent);border-color:rgba(96,165,250,0.14)}

/* Section titles */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.section-title{font-weight:800;font-size:20px;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.section-sub{color:var(--muted);font-size:12px}

/* Layout */
.layout{display:flex;gap:16px;margin-top:8px}

/* Clamp */
.clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ===== MAIN HERO ===== */
.main-hero{
  position:relative; flex:1; height:var(--main-hero-height);
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04); cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.main-hero:hover{transform:translateY(-8px);box-shadow:0 28px 56px rgba(2,6,23,0.7)}
.main-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.main-hero img.logo-fit{object-fit:contain; padding:0}
.main-hero .overlay{
  position:absolute; left:0; right:0; bottom:0; padding:16px;
  background:linear-gradient(180deg, rgba(2,16,37,0) 0%, rgba(2,16,37,0.6) 35%, rgba(2,16,37,0.9) 100%);
}
.main-hero .title{font-size:22px;font-weight:800;margin:0 0 6px 0}
.main-hero .meta{color:#c5d2e0;font-size:13px;margin-bottom:6px}
.main-hero .summary{color:#eaf0fb;font-size:14px}

/* Hero arrows */
.hero-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:999px;
  background:rgba(9,16,29,0.55); border:1px solid rgba(255,255,255,0.2);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter: blur(4px);
  cursor:pointer; user-select:none;
  transition:background .15s ease, transform .15s ease, opacity .15s ease;
  opacity:.88;
}
.hero-nav:hover{background:rgba(9,16,29,0.7); transform:translateY(-50%) scale(1.05)}
.hero-prev{left:12px}
.hero-next{right:12px}
.hero-nav svg{pointer-events:none}

/* ===== SIDE HEROES ===== */
.side-wrap{width:var(--side-hero-width);display:flex;flex-direction:column;gap:10px}
.side-grid{display:grid;gap:12px;grid-auto-rows: var(--side-hero-row-h)}
.side-hero{
  background:var(--card); border-radius:var(--radius); overflow:hidden;
  border:1px solid rgba(255,255,255,0.04);
  cursor:pointer; transition:transform .18s ease,box-shadow .18s ease;
  display:flex; flex-direction:column; min-height:0;
}
.side-hero:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(2,6,23,0.5)}
.side-hero-media{position:relative; flex:0 0 var(--side-hero-media-h); background:#061025}
.side-hero-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% var(--image-focal-y); display:block}
.side-hero-media img.logo-fit{object-fit:contain; padding:0}
.side-hero-body{flex:1 1 auto; min-height:0; overflow:hidden; padding:10px; display:flex; flex-direction:column; gap:6px}
.side-hero-title{font-size:16px;font-weight:800;margin:0;line-height:1.2}
.side-hero-summary{color:#eaf0fb;font-size:13px;line-height:1.35}
.side-hero-meta{color:#c5d2e0;font-size:12px; margin-top:auto}

/* Fade tail for clamped summary */
.fade-tail{
  mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}

/* Grid cards */
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.02);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(2,6,23,0.6)}
.thumb{width:100%;height:0;padding-bottom:56.25%;position:relative;background:#061025}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.logo-fit{object-fit:contain;padding:0}
.card-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.card-title{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.tag{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.card-summary{color:#dfe9f5;font-size:14px;line-height:1.3}

/* Pager */
.pager{display:flex;justify-content:center;margin:22px 0}
.btn{
  padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.02);color:#eaf0fb;font-size:14px;cursor:pointer;
}
.btn:hover{background:rgba(255,255,255,0.06)}

/* responsive */
@media(max-width:900px){
  .layout{flex-direction:column}
  .side-wrap{width:100% !important}
  .side-grid{grid-auto-rows: 260px}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">
      <div class="logo">GF</div>
      <div>
        <div class="title">GameFeed</div>
        <div class="subtitle">Direct from devs — Blizzard • Pokémon GO • Path of Exile</div>
      </div>
    </div>

    <div class="top-controls">
      <div class="search" title="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35" stroke="#9aa6b2" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Search title or summary..." aria-label="Search articles" />
      </div>

      <select id="sortSelect" class="select" title="Sort">
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Filter</div>
      <div id="filters" class="filters"></div>
    </div>
    <div style="text-align:right;color:var(--muted)"></div>
  </div>

  <div class="section-head">
    <div class="section-title">Featured Headlines</div>
    <div class="section-sub">Auto-rotating through top stories</div>
  </div>

  <main class="layout" role="main" aria-label="News hero and feed">
    <section class="main-hero" id="mainHero" tabindex="0" aria-label="Featured main article"></section>

    <section class="side-wrap" aria-label="Featured">
      <div class="side-grid" id="sideGrid" aria-live="polite"></div>
    </section>
  </main>

  <div class="section-title" style="margin-top:22px">Latest News</div>

  <section class="grid" id="feedGrid" aria-live="polite" aria-label="All news articles"></section>

  <div id="empty" style="display:none;text-align:center;color:var(--muted);padding:40px">No articles match your filters.</div>

  <div class="pager" id="pager" style="display:none">
    <button id="loadMore" class="btn" aria-label="Load more articles">Load more</button>
  </div>

  <div class="footer" style="display:none">Built with ❤️ — uses news.json</div>
</div>

rtal", "game": "Diablo Immortal", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt989ffb415ea874fa/6081aad335bb4d0cbd9c064b/D_Immortal_Icon.svg", "source": "blizzard"}, {"title": "The aura is strong in this Pokémon GO and Mega Lucario celebration!", "url": "https://pokemongo.com/en/post/tcg-mega-lucario-ex/", "summary": "Trainers,", "image": "https://lh3.googleusercontent.com/xO_q8QpF-7jOG3R-YCbZ_LQ_YYGGYxBcjo1paKNyG86QN4F5g3G-hIcnu8vyaWSeNFCiXPzVX5AvmJKy3YOff0nRTfYwNAHW5oWQN3gRK_wsJw=s2400-rj", "date": "2025-10-27T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}, {"title": "Path of Exile: Keepers of The Flame - Bloodline Ascendancy Classes", "url": "https://www.pathofexile.com/forum/view-thread/3869178", "summary": "In Path of Exile: Keepers of the Flame, you will be able to absorb the abilities of the certain bosses you defeat, in the form of additional Bloodline Ascendancy Classes. Find out more in today's new post.", "image": "images/poe-logo.png", "date": "2025-10-26T19:00:00Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "WoW Weekly: Legion Remix, Mythic Dungeon International, Turbo Boost, and More!", "url": "https://news.blizzard.com/en-us/article/24242428/wow-weekly-legion-remix-mythic-dungeon-international-turbo-boost-and-more", "summary": "Fast, frenetic fun awaits in Legion Remix, our most-celebrated MDI champions and contenders return to shatter records, and more! Every week brings thrilling new adventures and loot, so rally your allies and forge your legend in Azeroth.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/7p/7PCXGC0TF2XK1761255607833.png", "date": "2025-10-24T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-wa mage": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/of/OF52MZY9Z2831761247958052.png", "date": "2025-10-24T16:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "Announcing Path of Exile: Keepers of The Flame", "url": "https://www.pathofexile.com/forum/view-thread/3869036", "summary": "We're excited to bring you the announcements from GGG Live, where we’ll be revealing our new Path of Exile expansion, Keepers of The Flame! In this news post we've put together links to everything that is being announced during the www.twitch.tv/pathofexile livestream. We'll be updating this news post for your reference as the livestream progresses.", "image": "images/poe-logo.png", "date": "2025-10-23T19:00:34Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "How Midnight’s Upcoming Game Changes Will Impact Combat Addons", "url": "https://news.blizzard.com/en-us/article/24244638/how-midnights-upcoming-game-changes-will-impact-combat-addons", "summary": "The journey to update World of Warcraft’s combat experience continues, with a focus on making gameplay more intuitive and approachable—without requiring addons. In the Midnight expansion, we’re working closely with addon authors and taking in community feedback to create a more streamlined and engaging combat experience for everyone. The World of Warcraft development team shares the guiding principles behind these updates, focusing on ongoing customization and increased accessibility whether players choose to use addons or not.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/t8/T8QJDWCF1T2Y1755621947838.png", "date": "2025-10-23T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/as  Broken Isles. Re-experience the Legion mega-dungeon with the Return to Karazhan, and take on the Nighthold raid.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/uu/UUIQTL0DC4UT1761082205275.png", "date": "2025-10-21T21:59:36Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "The Mythic Dungeon International Returns October 24!", "url": "https://news.blizzard.com/en-us/article/24243637/the-mythic-dungeon-international-returns-october-24", "summary": "Prepare for broken records and crowned champions —MDI Season 3 is here!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/jx/JXJY8CQ9CX2M1760650295485.png", "date": "2025-10-21T17:05:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Diablo IV Patch Notes", "url": "https://news.blizzard.com/en-us/article/24222917/diablo-iv-patch-notes", "summary": "We will continually update this article with all patches the development team implements for Diablo IV.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/l3/L3LPQKVMFYZL1723657973250.png", "date": "2025-10-21T17:02:41Z", "subheading": "Diablo IV", "game": "Diablo IV", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt95aebf4d119210f5/5e543f7e8dc1e51c53168b7a/games-d4-colored.svg", "source": "blizzard"}, {"title": "Diablo Immortal Bug Fixes and Patch Notes for All Platforms", "url": "https://news.blizzard.com/en-us/article/24166781/diablo-immortal-bug-fixes-and-patch-notes-for-all-platforms", "summary": "We will continually update this blog with all bug fixes and patches the team implements for Diablo Immortal on all platforms.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/vk/VK6TL5H3CQ131734397130066.jpg", "date": "2025-10-21T17:00:00Z", "subheading": "Diablo Immortal", "game": "Diablo Immortal", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt989ffb415ea874fa/6081aad335bb4d0cbd9c064b/D_Immortal_Icon.svg", "source": "blizzard"}, {"title": "Original Warcraft III Keys Expire on November 21", "url": "https://news.blizzard.com/en-us/article/24241844/original-warcraft-iii-keys-expire-on-november-21", "summary": "Players who have yet to use their original Warcraft III key to access Warcraft III: Reforged should do so by November 21 before these legacy keys expire. After this date, Classic Warcraft III keys can no longer be redeemed for access to Warcraft III: Reforged.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/ma/MARXEP4DSG241618441718309.jpg", "date": "2025-10-21T17:00:00Z", "subheading": "Warcraft 3: Reforged", "game": "Warcraft 3: Reforged", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/bltac6bbe944de0a563/5d48a388bf384b03afd01567/warcraft-iii.svg", "source": "blizzard"}, {"title": "Tavern Time with Theorycrafting", "url": "https://news.blizzard.com/en-us/article/24241327/tavern-time-with-theorycrafting", "summary": "Streamers show off the new cards in a drops-powered battle on October 23!", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt573405be237a21a6/68f7bcec4901774dd110b3bf/HS_34p0_Theorycrafting_BattleNet_App_PHX_Gametab_Carousel_Mobile_1920x1080_SW01.jpg", "date": "2025-10-21T16:45:00Z", "subheading": "Hearthstone", "game": "Hearthstone", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt05905fb295358316/5d48a37efbf0e17fc6dafd3c/hearthstone.svg", "source": "blizzard"}, {"title": "Keepers of the Flame Livestream Twitch Drops", "url": "https://www.pathofexile.com/forum/view-thread/3868556", "summary": "Jeepers Keepers! A creepy crawly Twitch drop will be available during the Keepers of the Flame content reveal. Get the Hiveborn Crawler Pet for free by tuning into GGG Live at 12pm on October 23rd (PDT). Check out today's news post for more information.", "image": "images/poe-logo.png", "date": "2025-10-20T20:45:01Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "Path of Exile: Keepers of the Flame Teasers", "url": "https://www.pathofexile.com/forum/view-thread/3867910", "summary": "In this post we will compile all the Path of Exile: Keepers of the Flame teasers as they're posted. The most recent will always be at the top.", "image": "images/poe-logo.png", "date": "2025-10-17T18:57:16Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "WoW Weekly: Housing on the PTR, Hallow's End Begins, and More!", "url": "https://news.blizzard.com/en-us/article/24243439/wow-weekly-housing-on-the-ptr-hallow-s-end-begins-and-more", "summary": "Check out Housing Early Access on the PTR, haul in ghoulish delights and take on the Headless Horseman in the Hollow's End in-game holiday event, and more! Every week brings thrilling new adventures and loot, so rally your allies and forge your legend in Azeroth.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/0h/0HNPIMU2BQVN1760649074432.png", "date": "2025-10-17T17:00:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Haul in Ghoulish Delights During Hallow’s End", "url": "https://news.blizzard.com/en-us/article/24242427/haul-in-ghoulish-delights-during-hallows-end", "summary": "Hallow’s End celebrates the break of the Forsaken from the Scourge. Fun and mischief reign as the Innkeepers of Azeroth dole out treats and tricks for those seeking to partake in the festivities.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/sj/SJ9M6WYWEIQJ1760483144023.png", "date": "2025-10-17T16:58:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "Weekly Recall: Go Go Gadgets!", "url": "https://news.blizzard.com/en-us/article/24239494/weekly-recall-go-go-gadgets", "summary": "Stadium systems designer Larry Wu is here to introduce Gadgets, active items that aim to even out your early rounds and add devastating power to your late-game Builds. Learn about the production process, the value of trial and error, and some tips to maximize your Gadget investments.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/4c/4CSYRU0B414F1760641193825.png", "date": "2025-10-17T16:00:00Z", "subheading": "Overwatch 2", "game": "Overwatch 2", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt648969725f01df34/622a3969f2c2644f956a8934/Overwatch2.svg", "source": "blizzard"}, {"title": "Watch GGG Live on October 23 (PDT)", "url": "https://www.pathofexile.com/forum/view-thread/3867747", "summary": "Next Thursday, October 23rd PDT, we’ll be announcing our next expansion for Path of Exile 1. Tune in to twitch.tv/pathofexile at 12PM PDT. In the meantime, have a look at the 3.27 teaser video .", "image": "images/poe-logo.png", "date": "2025-10-16T19:01:06Z", "subheading": "Path of Exile", "game": "pathofexile", "game_icon": "", "source": "poe"}, {"title": "[Updated 10/16] Midnight Prologue: \"The Warning\" Content Update and Housing Early Access", "url": "https://news.blizzard.com/en-us/article/24241096/updated-10-16-midnight-prologue-the-warning-content-update-and-housing-early-access", "summary": "With the Ghosts of K’aresh behind us, Azeroth stands on the precipice of a future overshadowed by Xal’atath and the relentless advance of the Void. In The Warning, the stage is set for what comes next before continuing the story in the Midnight expansion. Players will also be welcomed home with the start of Housing Early Access!", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/94/9492L2087ZBT1759970906337.png", "date": "2025-10-16T18:20:00Z", "subheading": "World of Warcraft", "game": "World of Warcraft", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg", "source": "blizzard"}, {"title": "The 2.5.0 PTR: What You Need to Know", "url": "https://news.blizzard.com/en-us/article/24242857/the-2-5-0-ptr-what-you-need-to-know", "summary": "Preview the sweeping changes coming to Itemization, Monster combat, and more in the 2.5.0 PTR.", "image": "https://bnetcmsus-a.akamaihd.net/cms/blog_thumbnail/9z/9Z1ZOVKJM6PB1760550718295.png", "date": "2025-10-16T17:00:00Z", "subheading": "Diablo IV", "game": "Diablo IV", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt95aebf4d119210f5/5e543f7e8dc1e51c53168b7a/games-d4-colored.svg", "source": "blizzard"}, {"title": "Sanctuary Ignites with Itemization & Systems Changes", "url": "https://news.blizzard.com/en-us/article/24243142/sanctuary-ignites-with-itemization-systems-changes", "summary": "Preview the sweeping permanents changes coming to Itemization, Systems, and more, on both Seasonal and Eternal Realms.", "image": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blteb91889de96ecf02/68f1279cacfe317e794e3885/Inarius_Blog_Key_art_1920x1080_.png", "date": "2025-10-16T17:00:00Z", "subheading": "Diablo IV", "game": "Diablo IV", "game_icon": "https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/b _E2fHqrTI4lOMS1IjqVg0yvPSrsdLLsDWz_m6ad06Tcj03YMvIPd6NGi4OzYdJ0R_aIk18XcIDGszTM8_8SR8UG3YrQTL-6xno0RQrHO14A=s2400-rj", "date": "2025-07-16T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}, {"title": "Get ready for Summer Concert, a music-themed celebration! – Pokémon GO", "url": "https://pokemongo.com/en/post/pokemongo-summer-concert-2025/", "summary": "Saturday, July 19, to Tuesday, July 22, 2025, from 5:00 p.m.at 8:00 p.m. local time each day", "image": "https://lh3.googleusercontent.com/b1nTAKER5wogwm7Bc5DTozujL8mz3x8COz4B4VGGwqqEIEH3tn1CffLqQ2wLyX4blDsQ9Mfm9xaCXkq1nTfllIzHScAfVRQIQGmCqqt-f_3UFmU=s2400-rj", "date": "2025-07-11T00:00:00Z", "subheading": "Pokémon GO", "game": "pokemongo", "game_icon": "", "source": "pokemongo"}];

/* Config */
const PAGE_SIZE = 30;
const SIDE_HERO_COUNT = 2; 
let currentPage = 1;

/* helpers */
function toLocal(utc) {
  if (!utc) return "";
  try { const d = new Date(utc); return d.toLocaleString(); } catch(e) { return utc; }
}
function isLogoLike(url, srcName) {
  // Treat only explicit PoE logos as "logo-fit"; everything else fills
  if (!url) return false;
  const low = String(url).toLowerCase();
  if (low.includes("poe-logo") || low.includes("pathofexile")) return true;
  if (srcName && String(srcName).toLowerCase().includes("poe")) return true;
  return false;
}
function normalizeSource(raw){
  const s = (raw||"").toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
  if (!s) return "Other";
  if (s === "blizzard" || s === "battlenet" || s === "battlenetcom" || s === "battle" || s === "battlenetnews") return "Blizzard";
  if (s === "poe" || s === "pathofexile" || s === "pathof_exile") return "Path of Exile";
  if (s === "pokemongo" || s === "pokemon" || s === "pokemongolive" || s === "pokémon_go" || s === "pokemon_go") return "Pokémon GO";
  return (raw||"").replace(/\b\w/g, c => c.toUpperCase());
}
function categoryOf(a){
  const src = normalizeSource(a.source || "");
  if (src === "Blizzard" && a.subheading) return a.subheading; // split Blizzard by game
  return src || "Other";
}

/* init & filters */
function init() {
  buildFilterChips();
  document.getElementById("searchInput").addEventListener("input", () => { currentPage = 1; applyFilters(); });
  document.getElementById("sortSelect").addEventListener("change", () => { currentPage = 1; applyFilters(); });
  document.getElementById("loadMore").addEventListener("click", () => {
    currentPage += 1;
    renderGrid(getFilteredArticles());
  });
  applyFilters();
  startAutoplay();
}
function buildFilterChips() {
  const container = document.getElementById("filters");
  const cats = Array.from(new Set(ARTICLES.map(categoryOf))).sort();
  const state = buildFilterChips.state || (buildFilterChips.state = { selected: new Set(cats) });

  container.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (state.selected.has(c) ? " active" : "");
    b.textContent = c;
    b.dataset.val = c;
    b.addEventListener("click", () => {
      b.classList.toggle("active");
      if (state.selected.has(c)) state.selected.delete(c); else state.selected.add(c);
      currentPage = 1;
      applyFilters();
    });
    container.appendChild(b);
  });
}
function getSelectedFilters() { const s = buildFilterChips.state?.selected; return s ? Array.from(s) : []; }
function getFilteredArticles() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const selected = getSelectedFilters();
  let filtered = ARTICLES.filter(a => {
    if (!a || !a.url) return false;
    const cat = categoryOf(a);
    if (selected.length && !selected.includes(cat)) return false;
    if (q) {
      const hay = ((a.title||"") + " " + (a.summary||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const sort = document.getElementById("sortSelect").value;
  if (sort === "new") filtered.sort((x,y)=> new Date(y.date||0) - new Date(x.date||0));
  else if (sort === "old") filtered.sort((x,y)=> new Date(x.date||0) - new Date(y.date||0));
  else if (sort === "az") filtered.sort((x,y)=> (x.title||"").localeCompare(y.title||""));
  else if (sort === "za") filtered.sort((x,y)=> (y.title||"").localeCompare(x.title||""));
  if (filtered.length && renderMainHeroAndSide.stateIdx >= filtered.length) renderMainHeroAndSide.stateIdx = 0;
  return filtered;
}

/* hero (main + side X) */
function renderMainHeroAndSide(filtered) {
  const mainEl = document.getElementById("mainHero");
  const sideGrid = document.getElementById("sideGrid");
  mainEl.innerHTML = "";
  sideGrid.innerHTML = "";
  if (!filtered.length) return;

  const n = filtered.length;
  const idx = renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) % n + n) % n;

  const mainArticle = filtered[idx];

  // Main hero image & overlay
  const mImg = document.createElement("img");
  mImg.alt = mainArticle.title || "";
  mImg.src = mainArticle.image || "";
  if (isLogoLike(mainArticle.image, mainArticle.source)) mImg.classList.add("logo-fit");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const mTitle = document.createElement("div");
  mTitle.className = "title clamp-2";
  mTitle.innerText = mainArticle.title || "(no title)";
  const mMeta = document.createElement("div");
  mMeta.className = "meta clamp-1";
  mMeta.innerText = (mainArticle.subheading || normalizeSource(mainArticle.source) || "") + " • " + toLocal(mainArticle.date);
  const mSumm = document.createElement("div");
  mSumm.className = "summary clamp-3";
  mSumm.innerText = mainArticle.summary || "";
  overlay.appendChild(mTitle);
  overlay.appendChild(mMeta);
  overlay.appendChild(mSumm);
  mainEl.appendChild(mImg);
  mainEl.appendChild(overlay);
  mainEl.onclick = () => { window.open(mainArticle.url, "_blank"); };

  // Prev/Next buttons
  const prev = document.createElement("button");
  prev.className = "hero-nav hero-prev";
  prev.setAttribute("aria-label","Previous featured article");
  prev.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  prev.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(-1); });
  const next = document.createElement("button");
  next.className = "hero-nav hero-next";
  next.setAttribute("aria-label","Next featured article");
  next.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#eaf0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  next.addEventListener("click", (e)=>{ e.stopPropagation(); stopAutoplay(); shiftHero(1); });
  mainEl.appendChild(prev);
  mainEl.appendChild(next);

  // Side heroes (count configurable)
  const sideCount = Math.min(SIDE_HERO_COUNT, n - 1);
  for (let i=1;i<=sideCount;i++){
    const a = filtered[(idx + i) % n];

    const card = document.createElement("div");
    card.className = "side-hero";

    const media = document.createElement("div");
    media.className = "side-hero-media";
    const img = document.createElement("img");
    img.alt = a.title || "";
    img.src = a.image || "";
    if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
    media.appendChild(img);

    const body = document.createElement("div");
    body.className = "side-hero-body";

    const title = document.createElement("div");
    title.className = "side-hero-title clamp-2";
    title.innerText = a.title || "(no title)";

    const summ = document.createElement("div");
    summ.className = "side-hero-summary clamp-3 fade-tail";
    summ.innerText = a.summary || "";

    const meta = document.createElement("div");
    meta.className = "side-hero-meta clamp-1";
    meta.innerText = (a.subheading || normalizeSource(a.source) || "") + " • " + toLocal(a.date);

    body.appendChild(title);
    body.appendChild(summ);
    body.appendChild(meta);

    card.appendChild(media);
    card.appendChild(body);
    card.onclick = () => { window.open(a.url, "_blank"); };

    sideGrid.appendChild(card);
  }
}

/* grid rendering with pagination */
function makeCard(a) {
  const card = document.createElement("article");
  card.className = "card";
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const img = document.createElement("img");
  img.alt = a.title || "";
  img.src = a.image || "";
  if (isLogoLike(a.image, a.source)) img.classList.add("logo-fit");
  thumb.appendChild(img);

  const body = document.createElement("div");
  body.className = "card-body";
  const meta = document.createElement("div");
  meta.className = "card-meta";
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = ((normalizeSource(a.source) === "Blizzard") && a.subheading) ? a.subheading : normalizeSource(a.source);
  meta.appendChild(tag);
  const dt = document.createElement("div");
  dt.className = "badge";
  dt.textContent = toLocal(a.date);
  meta.appendChild(dt);

  const title = document.createElement("a");
  title.className = "card-title clamp-2";
  title.href = a.url;
  title.target = "_blank";
  title.rel = "noopener noreferrer";
  title.innerText = a.title || "(no title)";

  const summ = document.createElement("div");
  summ.className = "card-summary clamp-3";
  summ.innerText = a.summary || "";

  body.appendChild(meta);
  body.appendChild(title);
  body.appendChild(summ);

  card.appendChild(thumb);
  card.appendChild(body);

  card.addEventListener("click", () => { window.open(a.url, "_blank"); });

  return card;
}

function renderGrid(filtered){
  const grid = document.getElementById("feedGrid");
  const pager = document.getElementById("pager");
  grid.innerHTML = "";

  if (!filtered.length){
    document.getElementById("empty").style.display = "block";
    pager.style.display = "none";
    return;
  } else {
    document.getElementById("empty").style.display = "none";
  }

  const total = filtered.length;
  const showing = Math.min(total, currentPage * PAGE_SIZE);
  for (let i = 0; i < showing; i++){
    grid.appendChild(makeCard(filtered[i]));
  }

  // Pager visibility
  if (showing < total){
    pager.style.display = "flex";
  } else {
    pager.style.display = "none";
  }
}

/* filtering + autoplay */
function applyFilters() {
  const filtered = getFilteredArticles();
  renderMainHeroAndSide(filtered);
  renderGrid(filtered);
}
function startAutoplay(){ stopAutoplay(); startAutoplay.timer = setInterval(()=>{ shiftHero(1); }, 6000); }
function stopAutoplay(){ if (startAutoplay.timer){ clearInterval(startAutoplay.timer); startAutoplay.timer = null; } }
function shiftHero(delta){
  const filtered = getFilteredArticles();
  if (!filtered.length) return;
  renderMainHeroAndSide.stateIdx = ((renderMainHeroAndSide.stateIdx || 0) + delta + filtered.length) % filtered.length;
  renderMainHeroAndSide(filtered);
}

init();
</script>
